/* ===== A · الحبر والقائمة ===== */
.cA{--bg:#FFFFFF;--ink:#121212;--ink2:#716C65;--faint:#E7E5E0;--hfaint:#C9C5BE;--line:rgba(18,18,18,.09);--soft:#F6F5F2;
  background:var(--bg);color:var(--ink);height:800px;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none;transition:background .4s}
.cA::-webkit-scrollbar{display:none}
.cA.dark{--bg:#0F0F11;--ink:#F1EEE7;--ink2:#9B978F;--faint:#38373D;--hfaint:#5A5860;--line:rgba(241,238,231,.1);--soft:#18181B}
.cA .ink{--inkc:var(--ink);--inkf:var(--faint)}
.cA .nb{position:sticky;top:0;z-index:6;background:var(--bg);transition:box-shadow .2s}
.cA .nb .mini{height:0;overflow:hidden;display:flex;align-items:center;justify-content:space-between;padding:0 20px;opacity:0;transition:height .25s,opacity .2s}
.cA .nb .mini .ink{font-size:32px;line-height:1.5}
.cA .nb .mini span:not(.ink){font-family:'Noto Naskh Arabic',serif;font-size:15px;color:var(--ink2)}
.cA .nb .mini b{font-family:'Amiri',serif;font-size:19px;color:var(--ink);font-weight:400}
.cA.collapsed .nb .mini{height:50px;opacity:1}
.cA.collapsed .nb{box-shadow:0 .5px 0 var(--line)}
.cA .hero{text-align:center;padding:6px 20px 0}
.cA .hero .dt{font-family:'Noto Naskh Arabic',serif;font-size:15.5px;color:var(--ink2);line-height:1.6}
.cA .hero .w{display:block;font-size:var(--fs,124px);line-height:1.45;margin-top:4px}
.cA .hero p{font-family:'Noto Naskh Arabic',serif;font-size:18.5px;line-height:1.6;margin-top:-6px}
.cA .hero p em{font-style:normal;font-family:'Amiri',serif;font-size:21px}
.cA .nowc{display:flex;align-items:center;gap:16px;margin:26px 20px 0;padding:16px 18px;background:var(--soft);border-radius:22px}
.cA .nowc div{flex:1;min-width:0;line-height:1.45}
.cA .nowc small{font-size:14px;color:var(--ink2)}
.cA .nowc h3{font-size:20px;font-weight:600;margin:1px 0}
.cA .seal{width:76px;height:76px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:16px;font-weight:700;flex:none;box-shadow:inset 0 0 0 3px var(--soft),inset 0 0 0 4.5px var(--ink)}
.cA .seal.is-done{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.cA .seal:active{transform:scale(.95)}
.cA .cnt{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 20px 0;text-align:center}
.cA .cnt div{line-height:1.35;padding:2px 0}
.cA .cnt div+div{border-inline-start:1px solid var(--line)}
.cA .cnt b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.cA .cnt span{font-size:13.5px;color:var(--ink2)}
.cA .past{margin:14px 20px 0;min-height:44px;font-size:15.5px;font-weight:500;color:var(--ink2);text-align:start;display:flex;align-items:center;gap:6px}
.cA .past::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink2)}
.cA .sec{margin:16px 20px 0}
.cA .sh{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:2px}
.cA .sh .ink{font-size:32px;line-height:1.7;--inkf:var(--hfaint)}
.cA .sh span{font-family:'Amiri',serif;font-size:18px;color:var(--ink2)}
.cA .row{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:start;padding:13px 0;border-bottom:1px solid var(--line)}
.cA .row:last-child{border-bottom:0}
.cA .row .tx{flex:1;min-width:0;line-height:1.4}
.cA .row .tx b{display:block;font-size:17px;font-weight:400}
.cA .row.pr .tx b{font-weight:600}
.cA .row .tx span{font-size:14.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.cA .row.now .tx b{font-weight:700}
.cA .row.now .tx span{color:var(--ink);font-weight:600}
.cA .row.done .tx b{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--ink)}
.cA .ck{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--ink2);display:grid;place-items:center;flex:none;margin-top:1px;color:var(--bg)}
.cA .row.now .ck{border:2.4px solid var(--ink)}
.cA .row .ck.on{background:var(--ink);border-color:var(--ink)}
.cA .end{height:30px;flex:none}
.cA .ios-tab{background:color-mix(in srgb,var(--bg) 88%,transparent);border-top-color:var(--line)}
.cA .ios-tab span{color:var(--ink2)}
.cA .ios-tab .on{color:var(--ink)}
.cA .ios-tab .on b{font-weight:700}
.cA .ti{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex:none}
.cA .row .ti{margin-top:-1px}
.cA .row.pr .ti{background:var(--ink);color:var(--bg)}
.cA .row.done .ti{color:var(--ink2)}

.cA .row.now.pr .ti{box-shadow:none}

.cA .ti.big{width:52px;height:52px;border-radius:16px;background:var(--bg)}

.cA .cnt svg{color:var(--ink2)}
.cA .sh .tm{display:inline-flex;align-items:center;gap:6px}
.cA .sh .tm svg{color:var(--ink2)}

.ios .ck.on{background:var(--acc,var(--blue));border-color:var(--acc,var(--blue))}

const NEED_SLEEP = 420, ISHA_TO_BED_MIN = 30, WAKE_BEFORE_FAJR_QIYAM = 20, WAKE_BEFORE_FAJR_PLAIN = 10,
  MIN_NIGHT_FOR_QIYAM = 360, SHORT_NAP = 20, LONG_NAP = 90;

const CITIES = {

function lastSundayUTC(year, month) { // month 0-based; returns Date.UTC of last Sunday 01:00 UTC
  const d = new Date(Date.UTC(year, month + 1, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return Date.UTC(year, month, d.getUTCDate(), 1);
}
function utcOffset(cityKey, doy) {
  if (cityKey === 'sul') return 180;
  const noon = Date.UTC(2026, 0, 1 + doy, 12);
  return noon >= lastSundayUTC(2026, 2) && noon < lastSundayUTC(2026, 9) ? 60 : 0;
}
const clampDoy = (d) => Math.max(0, Math.min(364, d));
function times(cityKey, madhab, doy) {
  const c = CITIES[cityKey];
  const key = c.cases[madhab] || c.cases.SHAFI;
  const r = YAWM_TIMES[key][clampDoy(doy)];
  return { fajr: r[0], sunrise: r[1], dhuhr: r[2], asr: r[3], maghrib: r[4], isha: r[5] };
}

function nightPlan(isha, nextFajr, userBedtime = 1260, qiyamEnabled = true) {
  const bedtime = Math.max(userBedtime, isha + ISHA_TO_BED_MIN);
  const qiyam = qiyamEnabled && (nextFajr - WAKE_BEFORE_FAJR_QIYAM) - bedtime >= MIN_NIGHT_FOR_QIYAM;
  const wake = nextFajr - (qiyam ? WAKE_BEFORE_FAJR_QIYAM : WAKE_BEFORE_FAJR_PLAIN);
  const night = Math.max(0, wake - bedtime);
  const nap = NEED_SLEEP - night <= 30 ? SHORT_NAP : LONG_NAP;
  const total = night + nap;
  return { bedtime, wake, qiyam, witrBeforeSleep: !qiyam, night, nap, total, shortfall: Math.max(0, NEED_SLEEP - total) };
}

function fitSegment(start, end, blocks) {
  const notes = [], out = [];
  const avail = end - start;
  const dur = {};
  blocks.forEach((b) => { dur[b.key] = b.flex ? b.min : b.pref; });
  let live = blocks.slice();
  const total = () => live.reduce((s, b) => s + dur[b.key], 0);
  const byLowPriority = (arr) => arr.slice().sort((a, b) => b.priority - a.priority);
  const shrink = (pool) => {
    for (const b of byLowPriority(pool)) {
      const over = total() - avail;
      if (over <= 0) return;
      const cut = Math.min(over, dur[b.key] - b.min);
      if (cut > 0) { dur[b.key] -= cut; notes.push('shrunk:' + b.key); }
    }
  };
  shrink(live.filter((b) => b.droppable && !b.flex));
  for (const b of byLowPriority(live.filter((b) => b.droppable && !b.flex))) {
    if (total() - avail <= 0) break;
    live = live.filter((x) => x !== b);
    notes.push('dropped:' + b.key);
  }
  shrink(live.filter((b) => !b.droppable && !b.flex));
  const slack = avail - total();
  if (slack > 0) { const f = live.find((b) => b.flex); if (f) dur[f.key] += slack; }
  if (total() > avail) notes.push('overflow');
  let t = start;
  for (const b of live) {
    const d = dur[b.key];
    if (d <= 0) continue;
    out.push({ key: b.key, title: b.title, role: b.role, start: t, end: t + d, deep: b.deep, isPrayer: b.isPrayer,
      shrunkFrom: !b.flex && d < b.pref ? b.pref : null });
    t += d;
  }
  return { blocks: out, notes, dropped: blocks.filter((b) => !live.includes(b)) };
}

function weekdayOf(doy) { return new Date(Date.UTC(2026, 0, 1 + doy)).getUTCDay(); } // 0=Sun ... 5=Fri, 6=Sat

  const prevPlan = nightPlan(pv.isha, t.fajr + 1440, userBedtime, qiyamEnabled);
  const friday = weekdayOf(doy) === 5;
  const tmpl = friday ? fridayTemplate(plan.nap) : workdayTemplate(plan.nap);

const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;

  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(rad(M)) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(rad(2 * M)) * (0.019993 - 0.000101 * T) + Math.sin(rad(3 * M)) * 0.000289;
  const trueLong = L0 + C, omega = 125.04 - 1934.136 * T;

  const eps = eps0 + 0.00256 * Math.cos(rad(omega));

  const zen = deg(Math.acos(Math.max(-1, Math.min(1, cosZ))));
  const az = (deg(Math.atan2(Math.sin(rad(ha)), Math.cos(rad(ha)) * Math.sin(rad(lat)) - Math.tan(rad(decl)) * Math.cos(rad(lat)))) + 180 + 360) % 360;

const YN = { fajr: 'الفجر', dhuhr: 'الظهر', asr: 'العصر: عصا وظلها بطولها', maghrib: 'المغرب', isha: 'العشاء', mosque: 'الجمعة والجماعة', rahl: 'ورد الغدوة: رحل', steps: 'مشي وضوء الشمس', nib: 'تركيز: ريشة القلم', tea: 'استراحة: استكان', mail: 'الرسائل', phone: 'اتصالات', case: 'ميدان واجتماعات', nap: 'قيلولة', dumbbell: 'تدريب', laptop: 'تعلم تقني', child: 'وقت الابن', house: 'الأسرة', book: 'قراءة ووقت لك', page: 'المحاسبة', beads: 'الوتر والأذكار: مسبحة', bed: 'النوم', lantern: 'السَّحَر: فانوس', ghusl: 'التبكير للجمعة', meal: 'غداء الأسرة', palm: 'فراغ مباح: نخلة', hands: 'الدعاء', visit: 'صلة الرحم', hourglass: 'الباقي', seal: 'خلّصت', week: 'الأسبوع' };
const yi = (n, s = 24, w = 1.7) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${YI[n] || YI.page}</svg>`;
/* which icon a block wears */
function iconOf(b) {
  const k = b.key;
  const m = { fajr: 'fajr', dhuhr: 'dhuhr', asr: 'asr', maghrib: 'maghrib', isha: 'isha', jumua: 'mosque', ghadwa: 'rahl', light: 'steps', deep1: 'nib', deep2: 'nib', duha: 'tea', msgs1: 'mail', close: 'mail', work1: 'phone', work2: 'case', nap: 'nap', child: 'child', family: 'house', self: 'book', prep: 'page', witr: 'beads', sleep: 'bed', qiyam: 'lantern', qiyam2: 'lantern', jumua_prep: 'ghusl', lunch: 'meal', visit: 'visit', free: 'palm', dua: 'hands', self_am: 'tea' };
  if (k === 'train') return /مشي/.test(b.title) ? 'steps' : /تعلم/.test(b.title) ? 'laptop' : 'dumbbell';
  return m[k] || 'page';
}

/* ================= A · الحبر والقائمة ================= */
C.A = {
  name: 'الحبر والقائمة',
  about: 'فوق: كلمة الحبر للصلاة الجاية، تتعبى ويّا الوقت، وتحتها شغلتك الحين وختم «خلّصت». تحت: جدولك قائمة مثل التذكيرات، وعنوان كل قسم اسم الصلاة بالرقعة يتعبى حبر على كد ما يمشي وقته، واللي تخلّصه تأشّر عليه ويتشطب. انزل بالقائمة وشوف الكلمة الكبيرة تصغر وتثبت فوق. وبعد العشاء الشاشة تصير داكنة لحالها.',
  render(root, M) {
    const ui = G.ui.A || (G.ui.A = {});
    root.classList.add('ios');
    const dark = M.t >= M.tt.isha || M.t < M.tt.fajr;
    root.classList.toggle('dark', dark);
    const s = inkState(M), tt = M.tt, cur = M.cur;
    const S = [['الفجر', tt.fajr, tt.sunrise, 'fajr'], ['الضحى', tt.sunrise, tt.dhuhr, 'tea'], [M.d.friday ? 'الجمعة' : 'الظهر', tt.dhuhr, tt.asr, M.d.friday ? 'mosque' : 'dhuhr'], ['العصر', tt.asr, tt.maghrib, 'asr'], ['المغرب', tt.maghrib, tt.isha, 'maghrib'], ['العشاء', tt.isha, M.plan.bedtime, 'isha'], ['الليل', M.plan.bedtime, M.nx.fajr + 1440, 'lantern']];
    const B = M.ext, prayers = B.filter((b) => b.isPrayer);
    const pD = prayers.filter((b) => M.done.has(b.key)).length, nD = B.filter((b) => M.done.has(b.key)).length;
    const nLeft = B.filter((b) => b.start > M.t).length;
    const pastN = S.filter(([, , b]) => M.t >= b).length;
    const row = (b) => {
      const now = b === cur, d = M.done.has(b.key);
      const sub = now ? `هسه · باقي ${durText(b.end - M.t)}` : `${fmt(b.start)} · ${durShort(b.end - b.start)}`;
      return `<button class="row${b.isPrayer ? ' pr' : ''}${now ? ' now' : ''}${d ? ' done' : ''}" data-k="${b.key}" aria-pressed="${d}"><span class="ti">${yi(iconOf(b), 24)}</span><span class="tx"><b>${esc(b.title)}</b><span>${sub}</span></span><span class="ck${d ? ' on' : ''}">${d ? icon('check', 15, 3) : ''}</span></button>`;
    };
    const secs = S.map(([n, a, b, ic]) => {
      if (M.t >= b && !ui.past) return '';
      const rows = B.filter((x) => x.start >= a && x.start < b); if (!rows.length) return '';
      const p = Math.max(0, Math.min(1, (M.t - a) / (b - a))) * 100;
      return `<section class="sec"><div class="sh"><span class="ink" style="--p:${p.toFixed(1)}%">${n}</span><span class="tm">${yi(ic, 20)}${fmt(a)}</span></div>${rows.map(row).join('')}</section>`;
    }).join('');
    const fs = s.word.length > 5 ? 104 : 124;
    const pastW = pastN === 1 ? 'فترة وحدة فاتت' : pastN === 2 ? 'فترتين فاتن' : `${pastN} فترات فاتت`;
    root.innerHTML = `<div class="nb">${statusBar(M)}<div class="mini" aria-hidden="true">${inkSpan(s)}<span><b>${fmt(s.tgt)}</b> · بعد ${durShort(s.tgt - M.t)}</span></div></div>
      <header class="hero" id="mHero"><div class="dt">${M.day} ${M.dayNum} ${M.month} · ${M.hijri}</div>
        <span class="ink w" style="--p:${s.p.toFixed(1)}%;--fs:${fs}px" role="img" aria-label="${s.word} بعد ${durText(s.tgt - M.t)}">${s.word}</span>
        <p>بعد ${durText(s.tgt - M.t)}، الساعة <em>${fmt(s.tgt)}</em></p></header>
      ${cur ? `<section class="nowc"><span class="ti big">${yi(iconOf(cur), 30)}</span><div><small>هسه</small><h3>${esc(cur.title)}</h3><small>لحد ${fmt(cur.end)}</small></div>${doneBtn(M, 'seal')}</section>` : ''}
      <div class="cnt"><div>${yi('mosque', 22)}<b>${pD}/5</b><span>الصلوات</span></div><div>${yi('seal', 22)}<b>${nD}</b><span>خلّصت</span></div><div>${yi('hourglass', 22)}<b>${nLeft}</b><span>باقي اليوم</span></div></div>
      ${pastN ? `<button class="past" data-x="past">${ui.past ? 'أخفي اللي فات' : pastW + '، اضغط تشوفها'}</button>` : ''}
      ${secs}<div class="end"></div>${tabBar('today')}`;
    const hero = root.querySelector('#mHero');
    const onScroll = () => { ui.st = root.scrollTop; root.classList.toggle('collapsed', root.scrollTop > hero.offsetTop + hero.offsetHeight - 70); };
    root.onscroll = onScroll;
    if (ui.st) root.scrollTop = ui.st; onScroll();
    root.onclick = (e) => {
      if (e.target.closest('[data-done]') && cur) { markDone(M, cur.key); renderAll(true); return; }
      const r = e.target.closest('[data-k]'); if (r) { markDone(M, r.dataset.k); renderAll(true); return; }
      if (e.target.closest('[data-x]')) { ui.past = !ui.past; renderAll(true); }
    };
  },
};

      <h3>القواعد</h3><ul class="rules"><li>شبكة 24، خط 1.7، أطراف مدورة.</li><li>بكل أيقونة جزء واحد بس معبّى (الحبر).</li><li>ما تنعكس باليمين واليسار، مثل الساعة.</li><li>الصلاة على مربع أسود، والفقرة على مربع فاتح.</li></ul>
      <h3>المجموعة (${Object.keys(YI).length})</h3><div class="grid">${Object.keys(YI).map((n) => `<div>${yi(n, 34, 1.6)}<span>${YN[n]}</span></div>`).join('')}</div>`;

};
