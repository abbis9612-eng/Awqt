<title>يوم: منظّم الوقت</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Kufi+Arabic:wght@400..900&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone, centred, with the controls to try it above and the notes below. */
:root{--page:#E9E9E6;--txt:#151515;--mut:#5f5c57;--edge:#151515}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b1b1d;--txt:#ECE9E2;--mut:#a7a39b;--edge:#ECE9E2;color-scheme:dark}}
:root[data-theme="dark"]{--page:#1b1b1d;--txt:#ECE9E2;--mut:#a7a39b;--edge:#ECE9E2;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--txt);font-family:'Noto Naskh Arabic','Noto Naskh Arabic UI',serif;-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 36px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #2F6FEB;outline-offset:2px}
.v{max-width:430px;margin:0 auto}
.v-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.v-top h1{font-size:18px;font-weight:700}
.v-top span{font-size:13.5px;color:var(--mut)}
#pick{display:none}
.scrub{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.scrub input{flex:1;accent-color:var(--edge);height:32px;direction:ltr;min-width:0}
.scrub output{font-size:15px;font-weight:600;min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.scrub button{min-height:40px;padding:0 12px;border:1.5px solid var(--edge);border-radius:4px;font-size:14px;font-weight:600}
.scrub button[hidden]{display:none}
.obbtn{min-height:44px;padding:0 14px;border:1.5px solid var(--edge);border-radius:4px;font-size:14px;font-weight:600;margin:0 0 6px}
.fonts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 0 10px;font-size:14.5px;color:var(--mut)}
.fonts button{min-height:44px;padding:0 16px;border:1.5px solid var(--edge);border-radius:999px;font-size:15px;font-weight:700;color:var(--txt)}
.fonts button[aria-pressed="true"]{background:var(--edge);color:var(--page)}
.try{display:flex;align-items:center;gap:8px;font-size:14.5px;color:var(--mut);padding:0 0 12px;min-height:44px}
.try input{width:20px;height:20px;accent-color:var(--edge)}
.phone{position:relative;overflow:hidden;min-height:780px;isolation:isolate;direction:rtl}
@media (min-width:441px){.phone{border-radius:6px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}}
#about{padding:16px 0 0;font-size:15.5px;line-height:1.85}
.v-note{padding:10px 0 0;font-size:13.5px;line-height:1.75;color:var(--mut)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
/* ===== A · الحبر ===== */
.cA{--ink:#121212;--faint:#E6E4DF;--grey:#77736C;background:#fff;color:var(--ink);font-family:'Noto Naskh Arabic',serif;padding:0;display:flex;flex-direction:column;height:800px;overflow-y:auto;scrollbar-width:none}
.cA::-webkit-scrollbar{display:none}
.cA > *:not(.ios-tab){margin-inline:24px}
.cA .top{margin-top:24px}
.cA .top{display:flex;justify-content:space-between;align-items:flex-start}
.cA .top b{display:block;font-size:18px;font-weight:700;line-height:1.5}
.cA .top span{font-size:14.5px;color:var(--grey)}
.cA .top .clk{font-family:'Amiri',serif;font-size:26px;line-height:1.2;font-variant-numeric:lining-nums}
.cA .word{margin-top:22px;text-align:center;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:var(--fs,138px);line-height:1.25;
  background:linear-gradient(to left,var(--ink) 0 calc(var(--p) - 1.5%),var(--faint) calc(var(--p) + 1.5%) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  padding:0 6px;transition:--p .6s}
.cA .when{text-align:center;font-size:19px;line-height:1.7;margin-top:2px}
.cA .when em{font-style:normal;font-family:'Amiri',serif;font-size:21px}
.cA .now{display:flex;align-items:center;gap:14px;margin-top:22px}
.cA .now div{flex:1;min-width:0}
.cA .now small{font-size:15px;color:var(--grey)}
.cA .now h3{font-size:23px;font-weight:700;line-height:1.5}
.cA .seal{width:88px;height:88px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;font-weight:700;flex:none;display:grid;place-items:center;
  box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4.5px var(--ink)}
.cA .seal.is-done{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.cA .seal:active{transform:scale(.96)}
.cA .after{margin-top:16px;display:grid;gap:2px}
.cA .after div{display:flex;gap:12px;align-items:center;font-size:17px;line-height:1.5;color:#3A3835;min-height:44px}
.cA .after span:not(.ti){flex:1}
.cA .after em{font-style:normal;font-family:'Amiri',serif;font-size:18px;color:var(--grey);width:44px;flex:none}
.cA .five{margin-top:auto;padding-top:18px;padding-bottom:14px;display:grid;grid-template-columns:repeat(5,1fr);text-align:center}
.cA .five b{display:block;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:25px;line-height:1.5;
  background:linear-gradient(to left,var(--ink) 0 var(--p),var(--faint) var(--p) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cA .five span{font-family:'Amiri',serif;font-size:17px;color:var(--grey)}
.cA .ti{--tbg:#fff;--tic:#121212}
.cA .ti.big{width:54px;height:54px;border-radius:17px}
.cA .ti.sm{width:34px;height:34px;border-radius:11px}
.cA .five i{display:flex;justify-content:center;font-style:normal;color:#121212;margin-bottom:2px}
.cA .five .nx i{transform:scale(1.15)}
.cA .ios-tab{margin-top:0}
.cA .seal{width:80px;height:80px}
.cA{transition:background .4s}
.cA.dark{--ink:#F1EEE7;--faint:#38373D;--grey:#9B978F;background:#0F0F11}
.cA.dark .after div{color:#D3CFC7}
.cA.dark .ti{--tbg:#0F0F11;--tic:#F1EEE7}
.cA.dark .seal{color:#0F0F11;box-shadow:inset 0 0 0 3px #0F0F11,inset 0 0 0 4.5px var(--ink)}
.cA.dark .seal.is-done{background:#0F0F11;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.cA .five i{color:var(--ink)}
.cA.dark .ios-tab{background:rgba(15,15,17,.9);border-top-color:rgba(241,238,231,.1)}
.cA.dark .ios-tab span{color:#8A867F}
.cA.dark .ios-tab .on{color:#F1EEE7}
.cA .ios-tab .on{color:#121212}
/* ---- app shell ---- */
.cA .ios-tab button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8E8A83;min-height:48px;justify-content:center}
.cA .ios-tab button b{font-size:11.5px;font-weight:500}
.cA .ios-tab button[aria-current="page"]{color:var(--ink)}
.cA .ios-tab button[aria-current="page"] b{font-weight:700}
.cA.dark .ios-tab button{color:#8A867F}
.cA.dark .ios-tab button[aria-current="page"]{color:#F1EEE7}
.cA.dark .ti:not(.solid) svg,.cA.dark .five i svg,.cA.dark .tot i svg{filter:brightness(1.55)}
.cA .scr{display:flex;flex-direction:column;flex:1}
.cA .word.md{font-size:var(--fs,104px)}
.cA h4{font-size:15px;font-weight:700;color:var(--grey);margin:24px 0 6px}
.cA .row{display:flex;gap:12px;align-items:center;min-height:52px;border-bottom:1px solid var(--line,rgba(18,18,18,.08));width:100%;text-align:start;font-size:17px;line-height:1.5}
.cA .row:last-child{border-bottom:0}
.cA .row em{font-style:normal;font-family:'Amiri',serif;font-size:18px;color:var(--grey);width:46px;flex:none}
.cA .row .tx{flex:1;min-width:0}
.cA .row .tx small{display:block;font-size:14px;color:var(--grey);line-height:1.5}
.cA .row.on{font-weight:700}
.cA .row.past{color:var(--grey)}
.cA.dark{--line:rgba(241,238,231,.1)}
/* night */
.cA .nline{margin-top:20px}
.cA .nline svg{width:100%;height:64px;display:block;overflow:visible}
.cA .verdict{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:18px;font-weight:700;line-height:1.5}
.cA .verdict small{display:block;font-size:14.5px;font-weight:400;color:var(--grey)}
.cA .ctl{margin-top:8px}
.cA .ctl .row{min-height:60px}
.cA .step{display:flex;align-items:center;gap:4px;border:1.5px solid var(--ink);border-radius:999px;padding:2px}
.cA .step button{width:42px;height:42px;border-radius:50%;font-size:22px;font-weight:700;display:grid;place-items:center}
.cA .step output{font-family:'Amiri',serif;font-size:20px;min-width:56px;text-align:center}
.cA .sw{width:54px;height:32px;border-radius:999px;border:1.5px solid var(--ink);position:relative;flex:none}
.cA .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:23px;height:23px;border-radius:50%;background:var(--ink);opacity:.35;transition:inset-inline-start .2s,opacity .2s}
.cA .sw[aria-checked="true"]{background:var(--ink)}
.cA .sw[aria-checked="true"]::after{inset-inline-start:25px;background:var(--bgc,#fff);opacity:1}
.cA.dark .sw[aria-checked="true"]::after{background:#0F0F11}
/* week */
.cA .tot{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:20px}
.cA .tot div{display:flex;align-items:center;gap:10px;line-height:1.35}
.cA .tot i{font-style:normal;color:var(--ink)}
.cA .tot b{display:block;font-family:'Amiri',serif;font-size:22px;font-weight:700}
.cA .tot span{font-size:13.5px;color:var(--grey)}
.cA .day{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line,rgba(18,18,18,.08));width:100%;text-align:start;position:relative}
.cA .day:last-child{border-bottom:0}
.cA .day .dn b{display:block;font-family:'Aref Ruqaa',serif;font-weight:700;font-size:22px;line-height:1.3}
.cA .day .dn span{font-family:'Amiri',serif;font-size:16px;color:var(--grey)}
.cA .day .fc b{display:block;font-size:16.5px;line-height:1.45}
.cA .day .fc span{font-size:14px;color:var(--grey);line-height:1.5}
.cA .day .ics{display:flex;gap:4px}
.cA .day.today::before{content:"";position:absolute;inset-inline-start:-14px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--ink)}
.cA .day.past .fc,.cA .day.past .dn{opacity:.55}
.cA .review{margin-top:18px;display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.7;padding-bottom:18px}
.cA .review b{display:block;font-size:16.5px}
/* page */
.cA .ck{width:28px;height:28px;border-radius:50%;border:1.7px solid var(--grey);display:grid;place-items:center;flex:none;color:var(--bgc,#fff)}
.cA .ck.on{background:var(--ink);border-color:var(--ink)}
.cA.dark .ck{--bgc:#0F0F11}
.cA label.q{display:block;font-size:17px;font-weight:700;margin-top:18px;line-height:1.6}
.cA textarea{width:100%;min-height:76px;margin-top:6px;border:1.5px solid var(--line,rgba(18,18,18,.12));border-radius:14px;padding:10px 12px;font:inherit;font-size:16.5px;line-height:1.7;background:transparent;color:var(--ink);resize:vertical}
.cA textarea:focus{outline:none;border-color:var(--ink)}
.cA .save{margin:18px 0 22px;min-height:54px;border-radius:999px;background:var(--ink);color:var(--bgc,#fff);font-size:17px;font-weight:700;width:100%}
.cA.dark .save{color:#0F0F11}
.cA .toast{position:sticky;bottom:96px;align-self:center;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.cA .toast.on{opacity:1}
.cA.dark .toast{color:#0F0F11}
.cA{--bgc:#fff}
.cA.dark{--bgc:#0F0F11}
.cA .ti.xs{width:28px;height:28px;border-radius:9px}
.cA .verdict .ti,.cA .review .ti{flex:none}
.cA .back{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:999px;font-size:15px;font-weight:700}

/* ===== shared iOS-like chrome ===== */
.ios{font-family:-apple-system,'SF Arabic','Noto Sans Arabic',system-ui,sans-serif;--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--indigo:#5856D6;--teal:#30B0C7;--label2:rgba(60,60,67,.6);--sep:rgba(60,60,67,.18);--group:#F2F2F7}
.ios-sb{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 26px;font-size:16px;flex:none}
.ios-sb b{font-weight:600;font-variant-numeric:tabular-nums}
.ios-sb span{display:flex;gap:6px;align-items:center}
.ios-tab{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 6px 26px;background:rgba(249,249,249,.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid rgba(0,0,0,.18);z-index:5}
.ios-tab span{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8E8E93}
.ios-tab b{font-size:11px;font-weight:500}
.ios-tab .on{color:var(--acc,var(--blue))}
.ios .ink{background:linear-gradient(to left,var(--inkc,#111) 0 calc(var(--p) - 1.5%),var(--inkf,#E6E4DF) calc(var(--p) + 1.5%) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'Aref Ruqaa',serif;font-weight:700}
.ios .cap{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:600}
.ios .ck{width:26px;height:26px;border-radius:50%;border:1.8px solid #C7C7CC;display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.ios .ck.on{background:var(--acc,var(--blue));border-color:var(--acc,var(--blue))}
.ios-tab.dark{background:rgba(22,22,24,.88);border-top-color:rgba(255,255,255,.12)}
.ios-tab.dark span{color:#7C7C80}
/* icon tiles (shared) */
.ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;color:var(--tic,#1B1B1B);background:color-mix(in srgb,var(--ic) 13%,var(--tbg,#fff))}
.ti.solid{background:var(--ic);color:#fff}
.ti.solid svg{--ic:#fff}
.ios-tab .on svg{--ic:var(--tabic,inherit)}

/* ===== «يوم» الحبر، النسخة الثانية: وجه أوضح وإعدادات مرتبة ===== */
.cA .top .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cA .gear{min-height:40px;padding:0 14px;border:1.5px solid var(--ink);border-radius:999px;font-size:14.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.cA .days{display:flex;gap:6px;margin-top:14px}
.cA .days button{flex:1;min-height:44px;border-radius:999px;border:1.5px solid var(--line,rgba(18,18,18,.14));font-size:15px;font-weight:600;color:var(--grey)}
.cA .days button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bgc,#fff)}
.cA .warn{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border:1.5px solid #B5473F;border-radius:16px;text-align:start;width:100%;font-size:15.5px;line-height:1.55}
.cA .warn b{display:block;font-size:16px}
.cA .warn span{color:var(--grey);font-size:14px}
.cA .warn i{font-style:normal;margin-inline-start:auto;font-weight:700;color:#B5473F;white-space:nowrap}
.cA.dark .warn{border-color:#D9786F}.cA.dark .warn i{color:#E59A92}
.cA .five.top5{margin-top:14px;padding:12px 0 6px;border-top:1px solid var(--line,rgba(18,18,18,.08));border-bottom:1px solid var(--line,rgba(18,18,18,.08))}
.cA .five.top5 b{font-size:22px}
.cA .five.top5 span{font-size:16px}
.cA .five.top5 .nx span{color:var(--ink);font-weight:700}
.cA .now{cursor:pointer;text-align:start;width:100%}
.cA .now .nexty{font-size:14.5px;color:var(--grey);margin-top:2px}
.cA .tl h5{display:flex;align-items:baseline;gap:8px;margin:20px 0 4px;font-family:'Aref Ruqaa',serif;font-size:21px;font-weight:700;line-height:1.4}
.cA .tl h5 em{font-style:normal;font-family:'Amiri',serif;font-size:16px;font-weight:400;color:var(--grey)}
.cA .tl .row{position:relative;min-height:54px}
.cA .tl .row .tx b{font-weight:400}
.cA .tl .row.on .tx b{font-weight:700}
.cA .tl .row.on::before{content:"";position:absolute;inset-inline-start:-14px;top:10px;bottom:10px;width:4px;border-radius:2px;background:var(--ink)}
.cA .tl .row .dur{font-family:'Amiri',serif;font-size:15px;color:var(--grey);flex:none}
.cA .tl .row .ok{font-size:15px;font-weight:700;flex:none}
.cA .tl .row .chg{display:block;font-size:13px;color:#B5473F}
.cA.dark .tl .row .chg{color:#E59A92}
.cA .tonight{display:flex;align-items:center;gap:12px;margin:18px 0 20px;padding:14px;border-radius:16px;background:color-mix(in srgb,#36459A 9%,var(--bgc,#fff));width:100%;text-align:start;font-size:16px;line-height:1.55}
.cA .tonight span{display:block;font-size:14px;color:var(--grey)}
.cA .tonight i{font-style:normal;margin-inline-start:auto;font-weight:700}
/* sheet */
.cA .veil{position:absolute;left:0;right:0;background:rgba(15,15,17,.42);z-index:20;display:flex;align-items:flex-end}
.cA .sheet{width:100%;background:var(--bgc,#fff);border-radius:24px 24px 0 0;padding:10px 24px 24px;box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.cA .sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--faint);margin:0 auto 14px}
.cA .sheet .hd{display:flex;gap:14px;align-items:center}
.cA .sheet h3{font-size:22px;font-weight:700;line-height:1.45}
.cA .sheet .when2{font-size:15.5px;color:var(--grey)}
.cA .sheet .when2 em{font-style:normal;font-family:'Amiri',serif;font-size:18px;color:var(--ink)}
.cA .sheet .why{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#B5473F 8%,var(--bgc,#fff));font-size:15px;line-height:1.7}
.cA .sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.cA .sheet .acts button{min-height:52px;border-radius:999px;border:1.5px solid var(--ink);font-size:16px;font-weight:700}
.cA .sheet .acts .pri{background:var(--ink);color:var(--bgc,#fff)}
.cA .sheet .close{display:block;margin:12px auto 0;min-height:44px;padding:0 18px;font-size:15px;color:var(--grey)}
/* settings */
.cA .sh{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.cA .sh h2{font-family:'Aref Ruqaa',serif;font-size:36px;font-weight:700;line-height:1.3}
.cA .sh p{font-size:14.5px;color:var(--grey)}
.cA .health{display:flex;gap:12px;align-items:center;margin-top:16px;padding:14px;border-radius:18px;border:1.5px solid var(--line,rgba(18,18,18,.12));width:100%;text-align:start;font-size:16px;line-height:1.55}
.cA .health b{display:block;font-size:17px}
.cA .health span{font-size:14px;color:var(--grey)}
.cA .health.bad{border-color:#B5473F}
.cA .grp{margin-top:6px}
.cA .grp .row{min-height:58px}
.cA .grp .row .val{font-size:15px;color:var(--grey);text-align:end;max-width:46%;line-height:1.45}
.cA .grp .row .chev{font-size:18px;color:var(--grey);flex:none;width:14px;text-align:center}
.cA .grp .row.danger .val{color:#B5473F;font-weight:700}
.cA .note{font-size:14.5px;line-height:1.75;color:var(--grey);margin-top:10px}
.cA .mos .row{min-height:64px}
.cA .mos .big{font-family:'Amiri',serif;font-size:24px;min-width:64px;text-align:center}
.cA .mos .adj{direction:ltr;unicode-bidi:isolate;font-family:'Amiri',serif;font-size:15px;color:var(--grey);min-width:34px;text-align:center}
.cA .mos .adj.ch{color:#B5473F;font-weight:700}
.cA .step.sm button{width:40px;height:40px;font-size:20px}

/* ===== النسخة الخامسة: أوضح، والحبر يتحرك ===== */
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}

/* header */

/* hero */
.cA .sub5{text-align:center;font-size:20px;font-weight:700;line-height:1.5;margin-top:0}

.cA .facts span{font-size:15px;color:var(--grey);padding:4px 12px;border-radius:999px;background:color-mix(in srgb,var(--ink) 5%,transparent)}
.cA .facts em{font-style:normal;font-family:'Amiri',serif;font-size:18px;color:var(--ink)}
.cA .acts5{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:18px}
.cA .act{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:84px;border-radius:20px;
  border:1.5px solid var(--line,rgba(18,18,18,.14));padding:8px 4px;transition:transform .18s cubic-bezier(.3,1.6,.5,1),background .2s}
.cA .act b{font-size:16px;font-weight:700;line-height:1.4}
.cA .act small{font-size:12.5px;color:var(--grey);line-height:1.4}

.cA .act.pri{background:var(--ink);border-color:var(--ink);color:var(--bgc,#fff)}

.cA .act:active{transform:scale(.95)}
.cA .act.stamping{animation:stamp .42s cubic-bezier(.3,1.5,.5,1)}
.cA .act.stamping::after{content:'';position:absolute;inset:-2px;border-radius:22px;border:3px solid var(--ink);animation:ring .5s ease-out forwards;pointer-events:none}
@keyframes stamp{0%{transform:scale(1)}35%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.35)}}
.cA .acts5.two{grid-auto-columns:1fr;margin-top:20px}
.cA .acts5.two .act{min-height:60px;flex-direction:row;gap:8px}

/* the day line */
.cA .rh{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px}
.cA .rh h4{margin:0;font-size:20px;color:var(--ink);font-family:'Aref Ruqaa',serif}
.cA .rh span{font-size:13.5px;color:var(--grey)}
.cA .pastbtn{width:100%;min-height:48px;margin-top:8px;border-radius:14px;border:1.5px dashed var(--line,rgba(18,18,18,.18));font-size:15px;font-weight:600;color:var(--grey)}
.cA .rail5{margin-top:6px}
.cA .r5{position:relative;--x:calc(50px + 12px + 17px)}
.cA .r5::before{content:'';position:absolute;inset-inline-start:calc(var(--x) - 1px);top:0;bottom:0;width:2px;
  background:linear-gradient(to bottom,var(--ink) 0 var(--fill),var(--faint) var(--fill) 100%)}
.cA .r5:first-child::before{top:26px}
.cA .r5:last-child::before{bottom:calc(100% - 26px)}
.cA .rb{position:relative;display:grid;grid-template-columns:50px 34px 1fr auto;column-gap:12px;align-items:center;width:100%;min-height:58px;padding:8px 0;text-align:start}

.cA .rb .ic{position:relative;z-index:1;display:grid;place-items:center;background:var(--bgc,#fff);border-radius:12px}
.cA .rb .tx{min-width:0;font-size:16.5px;line-height:1.5}

.cA .rb .tx small{display:block;font-size:13.5px;color:var(--grey);line-height:1.5}

.cA .rb .d small{font-family:'Noto Naskh Arabic',serif;font-size:12px;color:var(--grey);border:1px solid var(--line,rgba(18,18,18,.14));border-radius:999px;padding:0 7px;margin-top:2px;white-space:nowrap}
.cA .r5.pr .tx b{font-weight:700}
.cA .r5.past .rb .tx b,.cA .r5.past .rb .t{color:var(--grey)}
.cA .r5.past .ti{filter:grayscale(1);opacity:.55}
.cA .r5.cur>.rb{background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:18px;padding-inline-end:10px;margin-block:4px}
.cA .r5.cur .rb .t{color:var(--ink)}
.cA .r5.cur .rb .tx b{font-weight:700;font-size:18px}
.cA .okm{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bgc,#fff)}
.cA.dark .okm{color:#0F0F11}
.cA .pb{display:block;height:5px;border-radius:3px;background:var(--faint);margin:6px 0 2px;overflow:hidden}
.cA .pb i{display:block;height:100%;border-radius:3px;background:var(--ink);transition:width .6s}
.cA .pb.big{height:7px;margin-top:14px}
.cA .nowdot{position:absolute;z-index:2;top:calc(100% + 2px);width:10px;height:10px;border-radius:50%;background:var(--ink);inset-inline-start:12px}
.cA .nowdot::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--ink);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(2.6);opacity:0}}
.cA .tk5{display:flex;align-items:center;gap:10px;min-height:48px;padding-inline-start:calc(var(--x) + 22px)}
.cA .tk5 .ck{width:28px;height:28px;flex:none}
.cA .tk5 span{font-size:15.5px;line-height:1.45}
.cA .tk5 b{font-weight:600}
.cA .tk5 small{display:block;font-family:'Amiri',serif;font-size:14px;color:var(--grey)}
.cA .tk5.dn b{color:var(--grey);text-decoration:line-through}
/* done: an ink line is drawn through the words, and the circle fills */
.cA .just b{text-decoration:none!important;background:linear-gradient(currentColor,currentColor) no-repeat right 55%/100% 1.5px;animation:strike .5s ease-out both}
.cA .just .ck,.cA .just .okm{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes strike{from{background-size:0 1.5px}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* sheet */
.cA .veil.opening{animation:veil .22s ease-out both}
.cA .veil.opening .sheet{animation:rise5 .46s cubic-bezier(.2,1.25,.35,1) both}
.cA .focus.opening{animation:veil .3s ease-out both}
@keyframes veil{from{background:rgba(15,15,17,0)}}
@keyframes rise5{from{transform:translateY(100%)}}
.cA .s5 h4{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:16px;margin:20px 0 8px}
.cA .seg5{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:16px;background:color-mix(in srgb,var(--ink) 6%,transparent);padding:4px;gap:4px}
.cA .seg5 button{min-height:48px;border-radius:12px;font-size:15px;font-weight:600;color:var(--grey);transition:background .2s,color .2s}
.cA .seg5 button[aria-checked="true"]{background:var(--bgc,#fff);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:700}
.cA.dark .seg5 button[aria-checked="true"]{background:#2A292E}

/* a screen opening: the word pours in, the rest rises in order */
.cA.enter .word{animation:pour 1.2s cubic-bezier(.2,.7,.2,1) both}
@keyframes pour{from{--p:0%}}
.cA.enter .scr>*{animation:in5 .5s cubic-bezier(.2,.8,.2,1) both}
.cA.enter .scr>*:nth-child(2){animation-delay:.04s}.cA.enter .scr>*:nth-child(3){animation-delay:.08s}
.cA.enter .scr>*:nth-child(4){animation-delay:.12s}.cA.enter .scr>*:nth-child(5){animation-delay:.16s}
.cA.enter .scr>*:nth-child(6){animation-delay:.2s}.cA.enter .scr>*:nth-child(n+7){animation-delay:.24s}
@keyframes in5{from{opacity:0;transform:translateY(10px)}}
.cA.enter .scr>.word{animation:pour 1.2s cubic-bezier(.2,.7,.2,1) both}

/* tabs: the open one gets an ink pill that slides in */
.cA .ios-tab button[aria-current="page"] svg{animation:pill .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pill{from{transform:scale(.85)}}
.cA .ios-tab .plus{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.cA .ios-tab .plus:active{transform:scale(.9) rotate(90deg)}

/* ===== النسخة السادسة: الكلمة واضحة ===== */
@property --p{syntax:'<percentage>';inherits:true;initial-value:0%}
.cA{--disp:'Noto Kufi Arabic',sans-serif;--dispw:800;--outline:#8F8A82}
.cA.f-naskh{--disp:'Noto Naskh Arabic',serif;--dispw:700}
.cA.f-ruqaa{--disp:'Aref Ruqaa',serif;--dispw:700}
.cA.dark{--outline:#77736C}

/* every display word follows one choice */
.cA .word,.cA .five b,.cA .day .dn b,.cA .tl h5,.cA .sh h2,.cA .top5 b,.cA .rh h4{font-family:var(--disp);font-weight:var(--dispw)}
.cA.f-kufi .top5 b{font-size:26px;line-height:1.6}
.cA.f-kufi .sh h2{font-size:32px}
.cA.f-kufi .rh h4{font-size:19px}

/* the word: an outline you can read, and ink that fills it */
.cA .word{position:relative;white-space:nowrap;overflow:visible;background:none;color:var(--faint);-webkit-text-fill-color:var(--faint);
  -webkit-text-stroke:1.6px var(--outline);paint-order:stroke fill;line-height:1.35;transition:none}
.cA.f-kufi .word{line-height:1.6;-webkit-text-stroke-width:1.8px}
.cA.f-naskh .word{line-height:1.55}
.cA .word::after{content:attr(data-w);position:absolute;inset:0;padding:inherit;text-align:center;-webkit-text-stroke:0;
  background:linear-gradient(105deg,transparent 42%,color-mix(in srgb,var(--bgc,#fff) 38%,transparent) 50%,transparent 58%) no-repeat,linear-gradient(var(--ink),var(--ink));
  background-size:300% 100%,100% 100%;background-position:120% 0,0 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  -webkit-mask-image:linear-gradient(to left,#000 calc(var(--p) - 2%),transparent calc(var(--p) + 2%));mask-image:linear-gradient(to left,#000 calc(var(--p) - 2%),transparent calc(var(--p) + 2%));
  transition:--p .8s cubic-bezier(.2,.7,.2,1);animation:shine 6s ease-in-out 1.6s infinite}
.cA.dark .word::after{background:linear-gradient(105deg,transparent 42%,rgba(15,15,17,.32) 50%,transparent 58%) no-repeat,linear-gradient(var(--ink),var(--ink));
  background-size:300% 100%,100% 100%;-webkit-background-clip:text;background-clip:text}
@keyframes shine{0%,70%{background-position:120% 0,0 0}100%{background-position:-20% 0,0 0}}

/* a screen opening: the word soaks into the paper, then the ink pours to now */
.cA.enter .word,.cA.enter .scr>.word{animation:soak .7s cubic-bezier(.2,.7,.2,1) both,pour 1.4s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes soak{from{opacity:0;filter:blur(10px);transform:scale(1.06)}}
@keyframes pour{from{--p:0%}}
.cA.enter .top5 b,.cA.enter .sh h2{animation:soak .6s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.cA .word::after{animation:none}}
.cA .what{margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--ink) 5%,transparent);font-size:15.5px;line-height:1.75}

/* Yawm engine: a faithful JS port of docs/reference/resolver_reference.py (night plan + segment fitting),
   plus a NOAA solar-position model for the sundial. Prayer times come from the reference CSV (adhanpy). */
const NEED_SLEEP = 420, ISHA_TO_BED_MIN = 30, WAKE_BEFORE_FAJR_QIYAM = 20, WAKE_BEFORE_FAJR_PLAIN = 10,
  MIN_NIGHT_FOR_QIYAM = 360, SHORT_NAP = 20, LONG_NAP = 90;

const CITIES = {
  sul: { name: 'السليمانية', lat: 35.5613, lon: 45.4375, cases: { SHAFI: 'sulaymaniyah-shafi', HANAFI: 'sulaymaniyah-hanafi' },
    method: 'الهيئة المصرية العامة للمساحة' },
  lon: { name: 'لندن', lat: 51.5074, lon: -0.1278, cases: { SHAFI: 'london-shafi' },
    method: 'رابطة العالم الإسلامي، مع قاعدة سُبع الليل' },
};

function lastSundayUTC(year, month) { // month 0-based; returns Date.UTC of last Sunday 01:00 UTC
  const d = new Date(Date.UTC(year, month + 1, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return Date.UTC(year, month, d.getUTCDate(), 1);
}
function utcOffset(cityKey, doy) {
  if (cityKey === 'sul') return 180;
  const noon = Date.UTC(2026, 0, 1 + doy, 12);
  return noon >= lastSundayUTC(2026, 2) && noon < lastSundayUTC(2026, 9) ? 60 : 0;
}
const clampDoy = (d) => Math.max(0, Math.min(364, d));
function times(cityKey, madhab, doy) {
  const c = CITIES[cityKey];
  const key = c.cases[madhab] || c.cases.SHAFI;
  const r = YAWM_TIMES[key][clampDoy(doy)];
  return { fajr: r[0], sunrise: r[1], dhuhr: r[2], asr: r[3], maghrib: r[4], isha: r[5] };
}

function nightPlan(isha, nextFajr, userBedtime = 1260, qiyamEnabled = true) {
  const bedtime = Math.max(userBedtime, isha + ISHA_TO_BED_MIN);
  const qiyam = qiyamEnabled && (nextFajr - WAKE_BEFORE_FAJR_QIYAM) - bedtime >= MIN_NIGHT_FOR_QIYAM;
  const wake = nextFajr - (qiyam ? WAKE_BEFORE_FAJR_QIYAM : WAKE_BEFORE_FAJR_PLAIN);
  const night = Math.max(0, wake - bedtime);
  const nap = NEED_SLEEP - night <= 30 ? SHORT_NAP : LONG_NAP;
  const total = night + nap;
  return { bedtime, wake, qiyam, witrBeforeSleep: !qiyam, night, nap, total, shortfall: Math.max(0, NEED_SLEEP - total) };
}

function fitSegment(start, end, blocks) {
  const notes = [], out = [];
  const avail = end - start;
  const dur = {};
  blocks.forEach((b) => { dur[b.key] = b.flex ? b.min : b.pref; });
  let live = blocks.slice();
  const total = () => live.reduce((s, b) => s + dur[b.key], 0);
  const byLowPriority = (arr) => arr.slice().sort((a, b) => b.priority - a.priority);
  const shrink = (pool) => {
    for (const b of byLowPriority(pool)) {
      const over = total() - avail;
      if (over <= 0) return;
      const cut = Math.min(over, dur[b.key] - b.min);
      if (cut > 0) { dur[b.key] -= cut; notes.push('shrunk:' + b.key); }
    }
  };
  shrink(live.filter((b) => b.droppable && !b.flex));
  for (const b of byLowPriority(live.filter((b) => b.droppable && !b.flex))) {
    if (total() - avail <= 0) break;
    live = live.filter((x) => x !== b);
    notes.push('dropped:' + b.key);
  }
  shrink(live.filter((b) => !b.droppable && !b.flex));
  const slack = avail - total();
  if (slack > 0) { const f = live.find((b) => b.flex); if (f) dur[f.key] += slack; }
  if (total() > avail) notes.push('overflow');
  let t = start;
  for (const b of live) {
    const d = dur[b.key];
    if (d <= 0) continue;
    out.push({ key: b.key, title: b.title, role: b.role, start: t, end: t + d, deep: b.deep, isPrayer: b.isPrayer,
      shrunkFrom: !b.flex && d < b.pref ? b.pref : null });
    t += d;
  }
  return { blocks: out, notes, dropped: blocks.filter((b) => !live.includes(b)) };
}

function weekdayOf(doy) { return new Date(Date.UTC(2026, 0, 1 + doy)).getUTCDay(); } // 0=Sun ... 5=Fri, 6=Sat

function resolveDay(cityKey, madhab, doy, userBedtime = 1260, qiyamEnabled = true) {
  const t = times(cityKey, madhab, doy);
  const nx = times(cityKey, madhab, doy + 1), pv = times(cityKey, madhab, doy - 1);
  const plan = nightPlan(t.isha, nx.fajr + 1440, userBedtime, qiyamEnabled);
  const prevPlan = nightPlan(pv.isha, t.fajr + 1440, userBedtime, qiyamEnabled);
  const friday = weekdayOf(doy) === 5;
  const tmpl = friday ? fridayTemplate(plan.nap) : workdayTemplate(plan.nap);
  const anchors = { FAJR: t.fajr, SUNRISE: t.sunrise, DHUHR: t.dhuhr, ASR: t.asr, MAGHRIB: t.maghrib, ISHA: t.isha, BED: plan.bedtime };
  const blocks = [], notes = [], dropped = [];
  if (prevPlan.qiyam) blocks.push({ key: 'qiyam', title: 'السَّحَر: ركعتان والوتر', role: 'WORSHIP', start: prevPlan.wake - 1440, end: t.fajr, deep: false, isPrayer: false, shrunkFrom: null });
  for (const [a, b, bl] of tmpl) {
    const seg = fitSegment(anchors[a], anchors[b], bl);
    blocks.push(...seg.blocks); notes.push(...seg.notes);
    seg.dropped.forEach((d) => dropped.push({ key: d.key, title: d.title, segment: a }));
  }
  return { doy, times: t, plan, prevPlan, blocks, notes, dropped, friday };
}

/* ---------- NOAA solar position ---------- */
const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
function sunPosition(lat, lon, utcMs) {
  const jd = utcMs / 86400000 + 2440587.5, T = (jd - 2451545) / 36525;
  const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
  const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
  const C = Math.sin(rad(M)) * (1.914602 - T * (0.004817 + 0.000014 * T)) + Math.sin(rad(2 * M)) * (0.019993 - 0.000101 * T) + Math.sin(rad(3 * M)) * 0.000289;
  const trueLong = L0 + C, omega = 125.04 - 1934.136 * T;
  const lambda = trueLong - 0.00569 - 0.00478 * Math.sin(rad(omega));
  const eps0 = 23 + (26 + (21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60) / 60;
  const eps = eps0 + 0.00256 * Math.cos(rad(omega));
  const decl = deg(Math.asin(Math.sin(rad(eps)) * Math.sin(rad(lambda))));
  const y = Math.tan(rad(eps / 2)) ** 2;
  const eqTime = 4 * deg(y * Math.sin(2 * rad(L0)) - 2 * e * Math.sin(rad(M)) + 4 * e * y * Math.sin(rad(M)) * Math.cos(2 * rad(L0))
    - 0.5 * y * y * Math.sin(4 * rad(L0)) - 1.25 * e * e * Math.sin(2 * rad(M)));
  const d = new Date(utcMs);
  const utcMin = d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60;
  let ha = (utcMin + eqTime + 4 * lon) / 4 - 180;
  if (ha < -180) ha += 360;
  const cosZ = Math.sin(rad(lat)) * Math.sin(rad(decl)) + Math.cos(rad(lat)) * Math.cos(rad(decl)) * Math.cos(rad(ha));
  const zen = deg(Math.acos(Math.max(-1, Math.min(1, cosZ))));
  const az = (deg(Math.atan2(Math.sin(rad(ha)), Math.cos(rad(ha)) * Math.sin(rad(lat)) - Math.tan(rad(decl)) * Math.cos(rad(lat)))) + 180 + 360) % 360;
  return { alt: 90 - zen, az, decl };
}

function model() {

  const curI = ext.findIndex((b) => b.start <= t && t < b.end);

  const PRAY = PR.filter(([k]) => k !== 'sunrise').concat([['fajr2', 'الفجر', nx.fajr + 1440]]);
  const nxt = PRAY.find(([, , m]) => m > t);

        const k = 'page:' + M.doy, c = store.get(k, { pts: [], q: ['', '', ''] });

        const tt = root.querySelector('#aToast'); tt.textContent = 'انحفظت صحيفة اليوم على جهازك'; tt.classList.add('on'); setTimeout(() => tt.classList.remove('on'), 2200); return;
      }
      renderAll(true); root.scrollTop = y;
    };
  },
};

/* ================= «يوم» الحبر، النسخة الثانية =================
   Same identity, engine and data as yawm-ink.html. New: a clearer Today (yesterday/today/tomorrow,
   the five prayers on top, the whole day in periods, tap any item for its details), a warning when
   the adhan may be late, and Settings as short groups with their own pages. */

Object.assign(G, {
  page: null, sheet: null, alertsOk: store.get('v2ok', true),
  adj: store.get('v2adj', { fajr: 0, sunrise: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0 }),
  method: store.get('v2method', 'EG'), madhab: 'SHAFI', theme: store.get('v2theme', 'auto'),
  blocksRem: store.get('v2blocks', true), alarm: store.get('alarm', true), roles: 8,
});
const METHODS = [['EG', 'الهيئة المصرية العامة للمساحة', 'المستعملة بالعراق غالباً'], ['MWL', 'رابطة العالم الإسلامي', ''], ['UQ', 'أم القرى', ''], ['KR', 'جامعة العلوم الإسلامية بكراتشي', ''], ['TR', 'رئاسة الشؤون الدينية التركية', '']];
const CITY_LIST = ['السليمانية', 'أربيل', 'دهوك', 'كركوك', 'الموصل', 'بغداد', 'كربلاء', 'النجف', 'البصرة', 'لندن'];
const SIX = [['fajr', 'الفجر'], ['sunrise', 'الشروق'], ['dhuhr', 'الظهر'], ['asr', 'العصر'], ['maghrib', 'المغرب'], ['isha', 'العشاء']];
const PERIOD = [['fajr', 'الفجر'], ['sunrise', 'الضحى'], ['dhuhr', 'الظهر'], ['asr', 'العصر'], ['maghrib', 'المغرب'], ['isha', 'العشاء']];
const saveG = (k, v) => store.set(k, v);
const nextUp = (M) => M.ext.find((b) => b.start > M.t);
const chev = '<span class="chev" aria-hidden="true">‹</span>';
const adjSum = () => SIX.filter(([k]) => G.adj[k]).map(([k, n]) => `${n} ${G.adj[k] > 0 ? '+' : ''}${G.adj[k]}`).join('، ');

function top2(M) {
  return `<div class="top"><div><b>${M.day} ${M.dayNum} ${M.month}</b><span>${M.hijri}</span></div>
    <div class="side"><div class="clk">${fmt(M.t)}</div><button class="gear" data-go="settings">الإعدادات</button></div></div>`;
}
function dayChips() {
  return `<div class="days" role="group" aria-label="أي يوم">${[[-1, 'أمس'], [0, 'اليوم'], [1, 'باچر']].map(([s, n]) =>
    `<button data-shift="${s}" aria-pressed="${G.shift === s}">${n}</button>`).join('')}</div>`;
}
function warnBanner() {
  if (G.alertsOk) return '';
  return `<button class="warn" data-go="set-alerts">${tile('hourglass', false, 22)}<div><b>الأذان ممكن يتأخر</b><span>ناقص إذن «المنبهات والتذكيرات»</span></div><i>صلّحها</i></button>`;
}
function fivePrayers(M) {
  const s = inkState(M);
  const PI = { fajr: 'fajr', dhuhr: M.d.friday ? 'mosque' : 'dhuhr', asr: 'asr', maghrib: 'maghrib', isha: 'isha' };
  return `<div class="five top5">${M.PR.filter(([k]) => k !== 'sunrise').map(([k, n, m]) => {
    const nx = k === s.key, fill = m <= M.t ? 100 : nx ? s.p : 0;
    return `<div class="${nx ? 'nx' : ''}"><i style="--ic:${ICOL[PI[k]]}">${yi(PI[k], 24)}</i><b style="--p:${fill.toFixed(1)}%">${n}</b><span>${fmt(m)}</span></div>`;
  }).join('')}</div>`;
}
function periodOf(M, b) {
  if (b.sleep || b.key === 'qiyam2') return 'night';
  let p = 'fajr';
  for (const [k] of PERIOD) if (M.tt[k] <= b.start) p = k;
  return p;
}
const dur = (b) => durShort(b.end - b.start);
function timeline(M) {
  const groups = {};
  for (const b of M.ext) (groups[periodOf(M, b)] ||= []).push(b);
  const order = [...PERIOD, ['night', 'الليل']];
  return `<div class="tl">${order.filter(([k]) => groups[k]).map(([k, n]) => {
    const at = k === 'night' ? M.plan.bedtime : M.tt[k];
    return `<h5>${n}<em>${fmt(at)}</em></h5>` + groups[k].map((b) => {
      const past = b.end <= M.t, on = b.start <= M.t && M.t < b.end, done = M.done.has(b.key);
      const ch = b.shrunkFrom ? `<small class="chg">قصّرناها اليوم من ${b.shrunkFrom} د</small>` : '';
      return `<button class="row${on ? ' on' : past ? ' past' : ''}" data-sheet="${b.key}">${tile(iconOf(b), b.isPrayer, 20, 'sm')}<em>${fmt(b.start)}</em>
        <span class="tx"><b>${esc(b.title)}</b>${ch}</span>${done ? '<span class="ok">✓</span>' : `<span class="dur">${dur(b)}</span>`}</button>`;
    }).join('');
  }).join('')}</div>`;
}

SCREENS.today = function (M) {
  const s = inkState(M), cur = M.cur, nb = nextUp(M);
  return `${dayChips()}${warnBanner()}
    ${inkWord(s.word, s.p, fitFs(s.word), `${s.word} بعد ${durText(s.tgt - M.t)}`)}
    <p class="when">بعد ${durText(s.tgt - M.t)}، الساعة <em>${fmt(s.tgt)}</em></p>
    ${fivePrayers(M)}
    ${cur ? `<section class="now">${tile(iconOf(cur), cur.isPrayer, 30, 'big')}<div data-sheet="${cur.key}" role="button" tabindex="0"><small>هسه</small><h3>${esc(cur.title)}</h3>
      <small>لحد ${fmt(cur.end)}</small>${nb ? `<div class="nexty">بعدها ${fmt(nb.start)}: ${esc(nb.title)}</div>` : ''}</div>${doneBtn(M, 'seal')}</section>` : ''}
    <h4>يومك كامل</h4>${timeline(M)}
    <button class="tonight" data-tab="night">${tile('bed', false, 22)}<div>الليلة: تنام <b>${fmt(M.plan.bedtime)}</b> وتكعد <b>${fmt(M.plan.wake)}</b>${M.plan.qiyam ? ' للسَّحَر' : ''}
      <span>${M.plan.shortfall ? `ينقصك ${durText(M.plan.shortfall)} عن 7 ساعات` : 'نومك يكفي'}</span></div><i>‹</i></button>`;
};

function sheetHtml(M) {
  const b = M.ext.find((x) => x.key === G.sheet);
  if (!b) return '';
  const done = M.done.has(b.key), label = done ? '✓ تم، ألغيه' : doneLabel(b);
  const why = b.shrunkFrom ? `<div class="why">اليوم قصّرناها إلى ${durText(b.end - b.start)} بدل ${durText(b.shrunkFrom)}، لأن الوقت بين الصلاتين أقصر. صلاتك ما تقصر عن وقتها.</div>`
    : b.isPrayer ? `<div class="why" style="background:color-mix(in srgb,#1E8768 9%,var(--bgc,#fff))">وقتها ثابت حسب مدينتك، وتكدر تطابقها ويّا جامعك من الإعدادات.</div>` : '';
  return `<div class="veil" data-close="1" style="top:VEILTOP;height:800px"><div class="sheet" role="dialog" aria-label="${esc(b.title)}">
    <div class="grab"></div><div class="hd">${tile(iconOf(b), b.isPrayer, 30, 'big')}<div><h3>${esc(b.title)}</h3>
    <p class="when2">من <em>${fmt(b.start)}</em> إلى <em>${fmt(b.end)}</em> · ${durText(b.end - b.start)}</p></div></div>${why}
    <div class="acts"><button class="pri" data-done="1">${label}</button><button data-go="set-day">عدّلها ‹</button></div>
    <button class="close" data-close="1">سكّر</button></div></div>`;
}

    if (q('[data-done]') && G.sheet) return go(() => { markDone(M, G.sheet); }, true);

    if (q('[data-adjreset]')) return go(() => { Object.keys(G.adj).forEach((k) => { G.adj[k] = 0; }); saveG('v2adj', G.adj); }, true);
    if ((el = q('[data-method]'))) return go(() => { G.method = el.dataset.method; saveG('v2method', G.method); }, true);
    if ((el = q('[data-look]'))) return go(() => { G.theme = el.dataset.look; saveG('v2theme', G.theme); }, true);
    if ((el = q('[data-wd]'))) { const i = +el.dataset.wd, on = store.get('v2work', [0, 1, 2, 3, 4, 5]); return go(() => saveG('v2work', on.includes(i) ? on.filter((x) => x !== i) : on.concat(i)), true); }
    if (q('[data-fix]')) return go(() => { G.alertsOk = true; saveG('v2ok', true); syncOk(); }, true);
    if ((el = q('[data-sw]'))) {

/* ================= «يوم» الحبر، النسخة الثالثة: منظّم وقت قبل كل شي =================

/* Words the quick add understands, on the phone only. */
function parseTask(raw) {
  let s = ' ' + raw.replace(/[٠-٩]/g, (c) => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)) + ' ';
  let when = null, d = null;
  const take = (re, f) => { const m = s.match(re); if (m) { f(m); s = s.replace(re, ' '); } };
  take(/\s(باچر|باجر|بكرة|بكره|غداً|غدا)\s/, () => { when = 'tomorrow'; });
  take(/\s(اليوم)\s/, () => { when = 'today'; });
  take(/\s(بعدين)\s/, () => { when = 'later'; });
  take(/\sساعة ونص\s/, () => { d = 90; });
  take(/\sساعتين\s/, () => { d = 120; });
  take(/\sنص ساعة\s/, () => { d = 30; });
  take(/\sربع ساعة\s/, () => { d = 15; });
  take(/\s(\d{1,3})\s*(د|دقيقة|دقايق|دقائق)\s/, (m) => { d = +m[1]; });
  take(/\s(\d{1,2})\s*(س|ساعة|ساعات)\s/, (m) => { d = +m[1] * 60; });
  take(/\sساعة\s/, () => { d = 60; });
  return { t: s.replace(/\s+/g, ' ').trim(), when, d };
}
function qdResolved() {
  const p = parseTask(G.qd.t || '');

  return { t: p.t, when, d, saw: (!G.qd.whenTap && !!p.when) || (!G.qd.dTap && !!p.d) };
}

/* Tasks: today's drop into the free gaps; tomorrow's show on tomorrow; «بالبال» wait for you. */
function placeTasks(M) {
  const want = G.shift === 0 ? 'today' : G.shift === 1 ? 'tomorrow' : '';
  const from = G.shift === 0 ? M.t : 0;
  const slots = M.ext.filter((b) => FREE.has(b.key) && b.end > from).map((b) => ({ b, at: ceil5(Math.max(b.start, from)) }));
  return G.tasks.filter((x) => (x.when || 'today') === want).map((task) => {
    if (task.done) return { task };
    const s = slots.find((x) => x.b.end - x.at >= task.d);
    if (!s) return { task, none: true };
    const start = s.at; s.at += task.d;
    return { task, slot: s.b, start };
  });
}

function dayChips() {
  const M0 = model(), today = M0.doy - G.shift, s0 = today - ((weekdayOf(today) + 1) % 7);
  return `<div class="strip" role="group" aria-label="أيام الأسبوع">${[0, 1, 2, 3, 4, 5, 6].map((i) => {
    const di = s0 + i, wd = (weekdayOf(di) + 1) % 7, sh = di - today, d = dateOf(di);
    const mine = (sh === 0 && G.tasks.some((x) => x.when === 'today' && !x.done)) || (sh === 1 && G.tasks.some((x) => x.when === 'tomorrow' && !x.done));
    return `<button data-shift="${sh}" aria-pressed="${G.shift === sh}" class="${sh === 0 ? 'tdy' : sh < 0 ? 'past' : ''}" aria-label="${SAT_DAYS[wd]} ${d.getUTCDate()}${sh === 0 ? '، اليوم' : ''}${mine ? '، بيه مهام' : ''}">
      <small>${DAY_SHORT[wd]}</small><b>${d.getUTCDate()}</b><i${mine ? '' : ' hidden'}></i></button>`;
  }).join('')}</div>`;
}

/* What the morning and evening notifications will say, shown before you turn them on. */
function morningText(M) {
  const n = G.tasks.filter((x) => x.when === 'today' && !x.done).length;
  const first = M.ext.find((b) => b.start >= M.tt.sunrise && !b.isPrayer);
  const work = ['job', 'study'].includes(G.life.kind) ? `، و${G.life.kind === 'job' ? 'الدوام' : 'الدراسة'} من ${fmt(G.life.from)} إلى ${fmt(G.life.to)}` : '';
  return `صباح الخير. اليوم عندك ${n ? `${n} مهام` : 'يوم بلا مهام'}${work}. أول شغلة: ${first ? esc(first.title) : '—'}.`;
}
function eveningText(M) {
  const n = G.tasks.filter((x) => x.when === 'today').length, d = G.tasks.filter((x) => x.when === 'today' && x.done).length;
  return `خلصت ${d} من ${n} مهام اليوم. دقيقتين محاسبة، وبعدها تنام ${fmt(M.plan.bedtime)} وتكعد ${fmt(M.plan.wake)}.`;
}
const notif = (title, body, at) => `<div class="notif" role="img" aria-label="شكل الإشعار: ${title}. ${body}"><div class="nh"><span class="nlogo">ي</span><span>يوم</span><span>· ${at}</span></div><b>${title}</b><p>${body}</p></div>`;
function dailyBlock(M) {
  const mAt = fmt(M.tt.sunrise), eAt = fmt(M.plan.bedtime - 30);
  return `<h4>ملخص الصبح ومحاسبة الليل</h4>
    ${notif('يومك', morningText(M), mAt)}
    <div class="row"><span class="tx">ملخص الصبح<small>الساعة ${mAt}، وية الشروق</small></span><button class="sw" role="switch" aria-checked="${G.morning}" data-v4sw="morning" aria-label="ملخص الصبح"></button></div>
    <div class="row"><span class="tx">محاسبة الليل<small>الساعة ${eAt}، قبل النوم بنص ساعة</small></span><button class="sw" role="switch" aria-checked="${G.evening}" data-v4sw="evening" aria-label="محاسبة الليل"></button></div>`;
}
const alarms3 = SCREENS.alarms;
SCREENS.alarms = (M) => alarms3(M).replace('<h4>تنبيهات فقراتك</h4>', dailyBlock(M) + '<h4>تنبيهات فقراتك</h4>');

/* The week: what you did, in plain words; nothing is drawn when there is nothing yet. */
const week3 = SCREENS.week;
SCREENS.week = function (M) {
  const s0 = M.doy - ((weekdayOf(M.doy) + 1) % 7);
  const fmin = G.focusLog.filter((f) => f.doy >= s0 && f.doy <= s0 + 6).reduce((a, f) => a + f.min, 0);
  const tdone = G.tasks.filter((x) => x.done).length;
  let pages = 0, items = 0;
  for (let i = 0; i < 7; i++) { const pg = store.get('page:' + (s0 + i), null); if (pg && pg.pts && pg.pts.length) pages++; items += store.get('done:' + (s0 + i), []).length; }
  const rows = [[tdone, 'seal', `خلصت ${tdone} مهام`], [fmin, 'nib', `ركّزت ${durText(fmin)}`], [items, 'week', `علّمت ${items} فقرات «خلّصت»`], [pages, 'page', `سوّيت المحاسبة ${pages} ${pages === 1 ? 'ليلة' : 'ليالي'}`]].filter((r) => r[0] > 0);
  const sum = `<h4>إنجازك هذا الأسبوع</h4>${rows.length ? `<div>${rows.map(([, ic, t]) => `<div class="row">${tile(ic, false, 20, 'sm')}<span class="tx">${t}</span></div>`).join('')}</div>`
    : '<p class="note">بعدك ما سجّلت شي هذا الأسبوع. أول شغلة تخلّصها تبين هنا.</p>'}`;
  return week3(M).replace('<h4>خطة الأسبوع</h4>', sum + '<h4>خطة الأسبوع</h4>');
};

/* First run: four short steps with a progress line, a way back and a skip. */
const OB_LINES = ['يرتّب يومك من الفجر للنوم', 'ينبّهك بوكت كل شغلة', 'يحسبلك نومك كل ليلة'];
SET.welcome = function (M) {
  const st = G.ob, N = 4;
  const bar = `<div class="obbar" role="progressbar" aria-valuemin="1" aria-valuemax="${N}" aria-valuenow="${st + 1}" aria-label="الخطوة ${st + 1} من ${N}">${[0, 1, 2, 3].map((i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>
    <div class="obtop">${st ? '<button class="back" data-ob="back">رجوع</button>' : '<span></span>'}${st < N - 1 ? '<button class="skip" data-ob="skip">تخطّى</button>' : ''}</div>`;
  if (st === 0) return `${bar}<div class="sh"><h2>هلا بيك بـ«يوم»</h2></div>
    <div class="obcard"><p>«يوم» يساعدك…</p>${OB_LINES.map((t, i) => `<div class="obl" style="--d:${0.5 + i * 0.7}s"><span class="obck">${icon('check', 15, 3)}</span><s>${t}</s></div>`).join('')}
      <div class="obl last" style="--d:${0.5 + 3 * 0.7}s"><span class="obck"></span><span>وهسه دورك</span></div></div>
    <button class="save" data-ob="next">يلا نبدي</button>`;
  if (st === 1) {
    const k = G.life.kind, timed = ['job', 'study'].includes(k);
    return `${bar}<div class="sh"><h2>شلون يومك؟</h2></div><p class="note">حتى نرتّب يومك من أول يوم. تكدر تغيّره بعدين.</p>
      <div role="radiogroup" aria-label="شلون يومك">${LIFE.map(([v, t, s, ic]) => `<button class="opt big" role="radio" aria-checked="${k === v}" data-life="${v}">${tile(ic, false, 22, 'sm')}<span class="tx">${t}<small>${s}</small></span><span class="ck${k === v ? ' on' : ''}">${k === v ? icon('check', 15, 3) : ''}</span></button>`).join('')}</div>
      ${timed ? `<h4>${k === 'job' ? 'الدوام' : 'الدراسة'}</h4>
        <div class="row"><span class="tx">يبدي</span><span class="step"><button data-lt="from:-30" aria-label="أبكر نص ساعة">−</button><output>${fmt(G.life.from)}</output><button data-lt="from:30" aria-label="أتأخر نص ساعة">+</button></span></div>
        <div class="row"><span class="tx">يخلص</span><span class="step"><button data-lt="to:-30" aria-label="أبكر نص ساعة">−</button><output>${fmt(G.life.to)}</output><button data-lt="to:30" aria-label="أتأخر نص ساعة">+</button></span></div>
        <div class="dchips" role="group" aria-label="الأيام">${DAY_SHORT.map((n, i) => `<button data-ld="${i}" aria-pressed="${G.life.days.includes(i)}" aria-label="${SAT_DAYS[i]}">${n}</button>`).join('')}</div>` : ''}
      <button class="save" data-ob="next"${k ? '' : ' disabled'}>التالي</button>`;
  }
  if (st === 2) return `${bar}<div class="sh"><h2>وين تسكن؟</h2></div><p class="note">حتى نعرف أوقات الصلاة ونرتّب يومك عليها. موقعك يبقى بتلفونك وما يطلع لأي مكان.</p>
    <button class="mini wide" data-ob="loc">موقعي الحالي</button>
    <div role="radiogroup" aria-label="المدينة">${CITY_LIST.slice(0, 6).map((n, i) => `<button class="opt" role="radio" aria-checked="${G.obCity === i}" data-obcity="${i}"><span class="tx">${n}</span><span class="ck${G.obCity === i ? ' on' : ''}">${G.obCity === i ? icon('check', 15, 3) : ''}</span></button>`).join('')}</div>
    <button class="save" data-ob="next">التالي</button>`;
  return `${bar}<div class="sh"><h2>آخر شي</h2></div><p class="note">حتى ينبّهك بوكت كل شغلة لازم تسمحله. هيچ راح يبين الإشعار:</p>
    ${notif('يومك', morningText(M), fmt(M.tt.sunrise))}
    <div class="row"><span class="tx">ملخص الصبح<small>وية الشروق</small></span><button class="sw" role="switch" aria-checked="${G.morning}" data-v4sw="morning" aria-label="ملخص الصبح"></button></div>
    <div class="row"><span class="tx">محاسبة الليل<small>قبل النوم بنص ساعة</small></span><button class="sw" role="switch" aria-checked="${G.evening}" data-v4sw="evening" aria-label="محاسبة الليل"></button></div>
    <div class="row"><span class="tx">تنبيه كل فقرة<small>وكت ما تبدي، وتغيّره لكل فقرة بعدين</small></span></div>
    <button class="save" data-ob="allow">اسمح بالتنبيهات</button><button class="close" data-ob="done">مو هسه</button>`;
};

/* Glue: extra handlers run first, then the v3 ones. */
let lastFocus = null;
const render3 = C.A.render;
C.A.render = function (root, M) {
  if (lastFocus && !G.focus) {
    const f = lastFocus, min = Math.round(f.total - Math.max(0, (f.end - Date.now()) / 60000));
    if (min > 0) { G.focusLog.push({ doy: M.doy, min }); persist4(); }
  }
  lastFocus = G.focus ? { ...G.focus } : null;
  render3(root, M);
  if (G.add === 'task' && !G.focus) {
    root.insertAdjacentHTML('beforeend', quickSheet().replace('VEILTOP', root.scrollTop + 'px'));
    root.style.overflowY = 'hidden';
  }
  for (const id of ['qT', 'taskT']) {
    const inp = root.querySelector('#' + id);
    if (!inp) continue;
    inp.oninput = () => {
      G.qd.t = inp.value;
      const h = root.querySelector('#' + id + 'H'); if (h) h.innerHTML = qdHint();
      const r = qdResolved();
      root.querySelectorAll('[data-qwhen]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.qwhen === r.when)));
      root.querySelectorAll('[data-qd]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.qd === r.d)));
    };
    inp.onkeydown = (e) => { if (e.key === 'Enter') root.querySelector('[data-qsave]').click(); };
    if (id === 'qT' && document.activeElement !== inp) {
      const y0 = root.scrollTop;
      inp.focus({ preventScroll: true });
      requestAnimationFrame(() => { root.scrollTop = y0; });
    }
  }
  const base = root.onclick;
  const go = (fn, keep) => { const yy = root.scrollTop; fn(); persist4(); persist(); renderAll(true); root.scrollTop = keep ? yy : 0; };
  const toast = (msg) => { const t = root.querySelector('#aToast'); if (!t) return; t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400); };
  root.onclick = (e) => {
    const q = (s) => e.target.closest(s);
    let el;
    if ((el = q('[data-add]')) && el.dataset.add === 'task') return go(() => { G.sheet = null; G.add = 'task'; }, true);
    if ((el = q('[data-qwhen]'))) return go(() => { G.qd.when = el.dataset.qwhen; G.qd.whenTap = true; }, true);
    if ((el = q('[data-qd]'))) return go(() => { G.qd.d = +el.dataset.qd; G.qd.dTap = true; }, true);
    if (q('[data-qsave]')) {
      const r = qdResolved();
      if (!r.t) return toast('اكتب المهمة أول');
      go(() => { G.tasks.unshift({ id: Math.max(0, ...G.tasks.map((x) => x.id)) + 1, t: r.t, d: r.d, done: false, when: r.when }); G.qd = { t: '', d: 30, when: 'today' }; G.add = null; }, true);
      return toast(r.when === 'today' ? 'انحطّت بأول فراغ اليوم' : r.when === 'tomorrow' ? 'انحطّت لباچر' : 'انحطّت بالبال');
    }
    if ((el = q('[data-move]'))) { const [id, w] = el.dataset.move.split(':'); return go(() => { G.tasks.find((x) => x.id === +id).when = w; }, true); }
    if ((el = q('[data-v4sw]'))) { const k = el.dataset.v4sw; return go(() => { G[k] = !G[k]; }, true); }
    if ((el = q('[data-life]'))) return go(() => { G.life.kind = el.dataset.life; }, true);
    if ((el = q('[data-lt]'))) { const [k, d] = el.dataset.lt.split(':'); return go(() => { G.life[k] = Math.max(5 * 60, Math.min(22 * 60, G.life[k] + +d)); if (G.life.to <= G.life.from) G.life.to = G.life.from + 60; }, true); }
    if ((el = q('[data-ld]'))) { const d = +el.dataset.ld; return go(() => { G.life.days = G.life.days.includes(d) ? G.life.days.filter((x) => x !== d) : G.life.days.concat(d).sort(); }, true); }
    if ((el = q('[data-obcity]'))) return go(() => { G.obCity = +el.dataset.obcity; }, true);
    if ((el = q('[data-ob]'))) {
      const a = el.dataset.ob;
      if (a === 'loc') return go(() => { G.obCity = 0; }, true) || toast('لگيناك بالسليمانية');
      if (a === 'next') return go(() => { G.ob = Math.min(3, G.ob + 1); });
      if (a === 'back') return go(() => { G.ob = Math.max(0, G.ob - 1); });
      const finish = () => { G.page = null; G.tab = 'today'; G.shift = 0; G.ob = 0; };
      if (a === 'allow') { go(() => { G.alertsOk = true; saveG('v2ok', true); syncOk(); finish(); }); return toast('يومك جاهز'); }
      go(finish); return toast(a === 'skip' ? 'تكدر ترجع لها من الإعدادات' : 'يومك جاهز. التنبيهات تكدر تشغّلها من «المنبّه»');
    }
    return base(e);
  };
};

/* ================= «يوم» الحبر، النسخة الخامسة: أوضح وأسرع، والحبر يتحرك =================
   Owner (2026-10-29): clearer, more practical, very easy and quick, icons and words that say
   exactly what they do, details that are easy to read, and motion that makes it feel alive.
   Same identity («الحبر»): paper, ink, the filling word, our own icons and three fonts.
   What changes:
   - One list for the day («خيط اليوم») instead of «الجاي» + «مهامك» + «يومك كامل». A thin line
     runs down the icons and fills with ink up to now, like the big word. What already passed
     folds into one line you can open.
   - Three clear action buttons under the word, each an icon and one or two words.
   - A reminder mark shows on a row only when it differs from your usual choice.
   - Motion, all for meaning and all off with «تقليل الحركة»: the word pours in when a screen
     opens, «خلّصت» presses like a seal and a ring of ink spreads, a done task gets an ink line
     drawn through it, the now-dot on the line breathes, and sheets rise with a small spring. */

Object.assign(G, { v5past: false });
let v5Key = '', v5Over = '', v5JustTask = null, v5JustItem = null;
const REM_SHORT = { start: 'بوقتها', 5: 'قبل 5 د', 10: 'قبل 10 د', off: 'بدون', adhan: 'أذان', notify: 'تنبيه', none: 'بدون' };
const remMark = (b) => {
  const r = remOf(b);
  if (b.isPrayer) return r === 'notify' ? '' : r === 'adhan' ? 'أذان' : 'بلا تنبيه';
  return String(r) === String(G.remDefault) ? '' : r === 'off' ? 'بلا تنبيه' : REM_SHORT[r];
};

function top2(M) {
  return `<div class="top5"><div><b>${M.day}</b><span>${M.dayNum} ${M.month} · ${M.hijri}</span></div>
    <div class="side"><span class="clk">${fmt(M.t)}</span><button class="txtbtn" data-go="settings">الإعدادات</button></div></div>`;
}

function rail5(M, placed) {
  const live = G.shift === 0, items = M.ext;
  const firstOpen = live ? items.findIndex((b) => b.end > M.t) : 0;
  const pastN = live ? Math.max(0, firstOpen) : 0;
  const open = !live || G.v5past;
  const inside = (b) => placed.filter((x) => x.slot && x.slot.key === b.key)
    .concat(placed.filter((x) => x.task.done && x.task.slotKey === b.key).map((x) => ({ task: x.task, start: x.task.at })))
    .sort((a, c) => a.start - c.start);
  const nTasks = placed.filter((x) => x.slot && !x.task.done).length;
  const rows = items.map((b, i) => {
    if (live && i < firstOpen && !open) return '';
    const past = live && b.end <= M.t, cur = live && b.start <= M.t && M.t < b.end, done = M.done.has(b.key);
    const fill = past ? 100 : cur ? (M.t - b.start) / (b.end - b.start) * 100 : 0;
    const mark = remMark(b), left = b.end - M.t;
    const sub = cur ? `<span class="pb" aria-hidden="true"><i style="width:${fill.toFixed(1)}%"></i></span><small>باقي ${durText(left)} · تخلص ${fmt(b.end)}</small>`
      : b.shrunkFrom ? `<small>قصرت اليوم من ${b.shrunkFrom} د</small>` : '';
    const tasks = inside(b).map((x) => `<div class="tk5${x.task.done ? ' dn' : ''}${v5JustTask === x.task.id ? ' just' : ''}" style="--fill:${fill.toFixed(1)}%">
        <button class="ck${x.task.done ? ' on' : ''}" data-task="${x.task.id}" role="checkbox" aria-checked="${x.task.done}" aria-label="${esc(x.task.t)}">${x.task.done ? icon('check', 14, 3) : ''}</button>
        <span><b>${esc(x.task.t)}</b><small>${fmt(x.start)} · ${x.task.d} د</small></span></div>`).join('');
    return `<div class="r5${cur ? ' cur' : past ? ' past' : ''}${b.isPrayer ? ' pr' : ''}${done ? ' dn' : ''}${v5JustItem === b.key ? ' just' : ''}" style="--fill:${fill.toFixed(1)}%">
      <button class="rb" data-sheet="${b.key}" aria-label="${esc(b.title)}، ${fmt(b.start)} إلى ${fmt(b.end)}${done ? '، خلصت' : ''}">
        <em class="t">${fmt(b.start)}</em><span class="ic">${tile(iconOf(b), b.isPrayer, 18, 'sm')}${cur ? '<i class="nowdot"></i>' : ''}</span>
        <span class="tx"><b>${esc(b.title)}</b>${sub}</span>
        <span class="d">${done ? `<span class="okm">${icon('check', 16, 2.6)}</span>` : dur(b)}${mark ? `<small>${mark}</small>` : ''}</span></button>${tasks}</div>`;
  }).join('');
  return `<div class="rh"><h4>يومك</h4><span>${items.length} فقرة${nTasks ? ` · ${nTasks} مهام بالفراغات` : ''}</span></div>
    ${pastN && live ? `<button class="pastbtn" data-v5past="1" aria-expanded="${open}">${open ? 'خفي اللي فات' : `${pastN === 1 ? 'فاتت فقرة وحدة' : pastN === 2 ? 'فاتت فقرتين' : `فاتت ${pastN} فقرات`}، شوفها`}</button>` : ''}
    <div class="rail5">${rows}</div>`;
}

SCREENS.today = function (M) {
  const s = nowState(M), placed = placeTasks(M), b = s.b, live = G.shift === 0;
  const canFocus = b && FOCUSABLE.has(b.key);
  const unplaced = placed.filter((x) => x.none);
  const hero = b
    ? `<p class="sub5">${esc(b.title)}</p><div class="facts"><span>تخلص <em>${fmt(b.end)}</em></span><span>باقي <em>${durText(b.end - M.t)}</em></span></div>`
    : s.next ? `<p class="sub5">${esc(s.next.title)}</p><div class="facts"><span>تبدي <em>${fmt(s.next.start)}</em></span></div>` : '';
  const acts = b && live ? `<div class="acts5">
      <button class="act pri" data-done="1">${yi('seal', 24, 1.8)}<b>${M.done.has(b.key) ? 'تم' : doneLabel(b)}</b><small>${M.done.has(b.key) ? 'اضغط حتى تلغي' : 'علّمها'}</small></button>
      ${canFocus ? `<button class="act" data-focus="${b.key}">${yi('nib', 24, 1.8)}<b>ركّز</b><small>${durText(b.end - M.t)}</small></button>` : ''}
      <button class="act" data-sheet="${b.key}">${yi('hourglass', 24, 1.8)}<b>نبّهني</b><small>${REM_SHORT[remOf(b)]}</small></button></div>` : '';
  return `${dayChips()}${warnBanner()}
    ${inkWord(s.word, s.p, fitFs(s.word), s.label)}${hero}${acts}
    ${nextPrayerLine(M)}
    ${rail5(M, placed)}
    ${unplaced.length ? `<p class="note">${unplaced.map((x) => `«${esc(x.task.t)}»`).join('، ')}: ما بقى فراغ يكفيها اليوم، تنتقل لباچر.</p>` : ''}
    <button class="tonight" data-tab="night">${tile('bed', false, 22)}<div>الليلة: تنام <b>${fmt(M.plan.bedtime)}</b> وتكعد <b>${fmt(M.plan.wake)}</b>${M.plan.qiyam ? ' للسَّحَر' : ''}
      <span>${M.plan.shortfall ? `ينقصك ${durText(M.plan.shortfall)} عن 7 ساعات` : 'نومك يكفي'}</span></div><i>‹</i></button>
    <button class="tonight" data-tab="page">${tile('page', false, 22)}<div>محاسبة المساء<span>عشر نقاط وثلاث أسئلة، دقيقتين</span></div><i>‹</i></button>`;
};

/* The item's sheet: what it is, when, its reminder in one row, and what you can do. */
function sheet3(M) {
  const b = M.ext.find((x) => x.key === G.sheet);
  if (!b) return '';
  const done = M.done.has(b.key), cur = G.shift === 0 && b.start <= M.t && M.t < b.end;

    const segEnd = i < pr.length - 1 ? pr[i + 1].start : (night[0] ? night[0].start : plan.bedtime);
    let pieces = [[p.end, segEnd]];
    busy().forEach((b) => { pieces = pieces.flatMap(([s, e]) => (b.end <= s || b.start >= e) ? [[s, e]] : [[s, b.start], [b.end, e]].filter(([a, c]) => c - a >= 5)); });
    const items = G.my.items.filter((it) => it.anchor === p.anchor).map((it) => ({ it, len: it.d, drop: false }));
    if (!items.length) return;
    const fit = () => {
      let pi = 0, cur = pieces.length ? pieces[0][0] : 0; const placed = [], left = [];
      for (const x of items.filter((y) => !y.drop)) {
        while (pi < pieces.length && pieces[pi][1] - Math.max(cur, pieces[pi][0]) < x.len) { pi++; if (pi < pieces.length) cur = pieces[pi][0]; }
        if (pi >= pieces.length) { left.push(x); continue; }
        const s = Math.max(cur, pieces[pi][0]); placed.push({ x, s }); cur = s + x.len;
      }
      return { placed, left };
    };
    const rev = items.slice().reverse();
    const steps = [...rev.filter((x) => x.it.imp === 'normal').map((x) => () => { x.len = minOf(x.it.d); }),
      ...rev.filter((x) => x.it.imp === 'normal').map((x) => () => { x.drop = true; }),
      ...rev.filter((x) => x.it.imp === 'high').map((x) => () => { x.len = minOf(x.it.d); }),
      ...rev.filter((x) => x.it.imp === 'high').map((x) => () => { x.drop = true; })];
    let r = fit();
    for (const step of steps) { if (!r.left.length) break; step(); r = fit(); }
    items.forEach((x) => {
      if (x.drop) notes.push(`«${x.it.t}» ما انحطّت اليوم: ما بقى وقت بعد ${PNAME[p.anchor]}${x.it.imp === 'high' ? '. إذا تريدها، قصّر غيرها أو غيّر وقتها من «عدّل يومك»' : ''}`);
      else if (x.len < x.it.d) notes.push(`«${x.it.t}» صارت ${x.len} دقيقة بدل ${x.it.d}، لأن الوقت بعد ${PNAME[p.anchor]} أقصر اليوم`);
    });
    r.placed.forEach(({ x, s }) => ext.push({ key: 'my' + x.it.id, title: x.it.t, start: s, end: s + x.len, mineIc: x.it.ic, item: x.it, shrunkFrom: x.len < x.it.d ? x.it.d : null }));
  });
  const all = pr.concat(night, fixed, ext).sort((a, b) => a.start - b.start);
  all.push({ key: 'sleep', title: 'النوم', start: plan.bedtime, end: plan.wake, sleep: true });
  if (plan.qiyam) all.push({ key: 'qiyam2', title: 'صلاة الليل والوتر', start: plan.wake, end: M.nx.fajr + 1440 });
  const out = [];
  all.forEach((b, i) => {
    out.push(b);
    const n = all[i + 1];
    if (n && !b.sleep && n.start - b.end >= 10) { const key = 'gap' + i; FREE.add(key); SHORT[key] = 'وقت فاضي'; out.push({ key, title: 'وقت فاضي', start: b.end, end: n.start }); }
  });
  out.forEach((b) => {
    if (b.item) { const c = CAT.find((x) => x.k === b.item.k); SHORT[b.key] = c ? c.w : b.item.t.split(' ')[0]; if (['nib', 'book', 'laptop'].includes(b.mineIc)) FOCUSABLE.add(b.key); }
    if (b.key.startsWith('work')) SHORT[b.key] = b.title;
  });
  M.ext = out; M.notes = notes;
  M.curI = out.findIndex((b) => b.start <= M.t && M.t < b.end);
  M.cur = out[M.curI] || null;
}

/* Tasks: pinned ones sit at their time; the rest drop into free time and never overlap. */
function placeTasks(M) {
  const want = G.shift === 0 ? 'today' : G.shift === 1 ? 'tomorrow' : '';
  const from = G.shift === 0 ? M.t : 0;
  const mine = G.tasks.filter((x) => (x.when || 'today') === want);
  const busy = mine.filter((x) => x.pin != null && !x.done).map((x) => [x.pin, x.pin + x.d]);
  const slots = M.ext.filter((b) => FREE.has(b.key) && b.end > from).map((b) => ({ b, at: ceil5(Math.max(b.start, from)) }));
  const res = new Map();
  mine.forEach((task) => {
    if (task.done || task.pin == null) return;
    const b = M.ext.find((x) => x.start <= task.pin && task.pin < x.end && !x.sleep);
    res.set(task, { task, slot: b, start: task.pin, pinned: true });
  });
  mine.forEach((task) => {
    if (task.done) return res.set(task, { task });
    if (task.pin != null) return;
    let found = null;
    for (const s of slots) {
      let at = s.at;
      for (let k = 0; k < 8; k++) { const hit = busy.find(([a, e]) => at < e && at + task.d > a); if (!hit) break; at = ceil5(hit[1]); }
      if (s.b.end - at >= task.d) { found = { s, at }; break; }
    }
    if (!found) return res.set(task, { task, none: true });
    busy.push([found.at, found.at + task.d]); found.s.at = found.at + task.d;
    res.set(task, { task, slot: found.s.b, start: found.at });
  });
  return mine.map((t) => res.get(t));
}

      <p class="lbl">كم تاخذ؟</p><div class="dchips" role="radiogroup" aria-label="كم تاخذ">${[15, 30, 45, 60, 90].map((d) => `<button role="radio" aria-checked="${it.d === d}" aria-pressed="${it.d === d}" data-wlen="${it.id}:${d}">${d} د</button>`).join('')}</div>
      <p class="lbl">إذا ضاك الوقت</p><div class="seg5" role="radiogroup" aria-label="أهميتها"><button role="radio" aria-checked="${it.imp === 'high'}" data-wimp="${it.id}:high">مهمة جداً</button><button role="radio" aria-checked="${it.imp === 'normal'}" data-wimp="${it.id}:normal">عادية، تقصر أول</button></div></div>`).join('');
  return `<div class="wants" role="group" aria-label="شنو تريد بيومك">${CAT.map((c) => `<button class="want" aria-pressed="${sel(c.k)}" data-want="${c.k}">${tile(c.ic, false, 20, 'sm')}<span>${c.t}</span></button>`).join('')}</div>

    ${G.my.items.length ? `<h4>رتّبها</h4>${cards}` : '<p class="note">اختار من فوك. إذا ما اخترت شي، يومك يبقى الصلوات والنوم والدوام، والباقي وقت فاضي لمهامك.</p>'}`;
}
function previewHtml(M) {

    <p class="note">${DAYS[dt.getUTCDay()]} ${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()]}: الفجر ${fmt(Mx.tt.fajr)}، المغرب ${fmt(Mx.tt.maghrib)}. شوف فقراتك شلون تمشي ويّا الصلاة.</p>
    ${Mx.notes.length ? `<div class="chg8"><b>شنو تغيّر هذا اليوم</b>${Mx.notes.map((n) => `<p>${esc(n)}</p>`).join('')}</div>` : ''}
    <div class="mini8">${Mx.ext.filter((b) => !b.key.startsWith('gap')).map((b) => `<div class="m8${b.isPrayer ? ' pr' : ''}"><em>${fmt(b.start % 1440)}</em>${tile(iconOf(b), b.isPrayer, 16, 'xs')}<span>${esc(b.title)}${b.item && b.item.anchor !== 'fixed' ? `<small>${ANCH.find((a) => a[0] === b.item.anchor)[1]}</small>` : b.fixedTime || (b.item && b.item.anchor === 'fixed') ? '<small>ساعة ثابتة</small>' : ''}</span><i>${durText(b.end - b.start)}</i></div>`).join('')}</div>
    <div class="row"><span class="tx">ساعة نومك<small>تكعد ${fmt(Mx.plan.wake % 1440)}${Mx.plan.qiyam ? ' لصلاة الليل' : ''}</small></span><span class="step"><button data-n="bed-" aria-label="أبكر ربع ساعة">−</button><output>${fmt(G.bed)}</output><button data-n="bed+" aria-label="أتأخر ربع ساعة">+</button></span></div>`;

SET.myday = (M) => `<div class="sh"><h2>يومك</h2><button class="back" data-go="">رجوع</button></div>

const OB8 = 6;
const w0 = w4;
SET.welcome = function (M) {
  const st = G.ob;
  const bar = `<div class="obbar o6" role="progressbar" aria-valuemin="1" aria-valuemax="${OB8}" aria-valuenow="${st + 1}" aria-label="الخطوة ${st + 1} من ${OB8}">${Array.from({ length: OB8 }, (_, i) => `<i class="${i <= st ? 'on' : ''}"></i>`).join('')}</div>
    <div class="obtop">${st ? '<button class="back" data-ob="back">رجوع</button>' : '<span></span>'}${st < OB8 - 1 ? '<button class="skip" data-ob="skip">تخطّى</button>' : ''}</div>`;
  const reuse = (k) => { const keep = G.ob; G.ob = k; const h = w0(M); G.ob = keep; return h.replace(/<div class="obbar"[^]*?<\/div>\s*<div class="obtop">[^]*?<\/div>/, bar); };

  if (st === 3) return reuse(2);

};

const render7 = C.A.render;
C.A.render = function (root, M) {
  if (G.my.built) { G.scratch = false; myDay(M); }
  render7(root, M);
  if (G.my.built && G.tab === 'today' && !G.page) {
    const rh = root.querySelector('.rh');
    if (rh) {
      rh.insertAdjacentHTML('beforeend', '<button class="mini" data-go="myday">عدّل يومك</button>');
      if (M.notes && M.notes.length) rh.insertAdjacentHTML('afterend', `<div class="chg8"><b>شنو تغيّر اليوم</b>${M.notes.map((n) => `<p>${esc(n)}</p>`).join('')}</div>`);
    }
  }
  if (G.sheet && G.sheet.startsWith('my')) {
    const b = M.ext.find((x) => x.key === G.sheet), at = root.querySelector('.sheet .hd');
    if (b && b.item && at && !root.querySelector('.sheet .what')) at.insertAdjacentHTML('afterend', `<div class="what"><b>شنو هاي؟</b>فقرة إنت حطيتها: ${b.item.anchor === 'fixed' ? `بساعة ثابتة ${fmt(b.item.at)}` : `${ANCH.find((a) => a[0] === b.item.anchor)[1]}، وتمشي ويّاه طول السنة`}، ${b.item.d} دقيقة، ${b.item.imp === 'high' ? 'مهمة جداً' : 'عادية'}. <button class="linkbtn" data-go="myday">عدّلها</button></div>`);
  }
  ['qT', 'taskT'].forEach((id) => { const inp = root.querySelector('#' + id); if (inp) inp.onkeydown = (e) => { if (e.key === 'Enter') { const b = root.querySelector('[data-qsave8]'); if (b) b.click(); } }; });
  const base = root.onclick;
  const go = (fn, keep = true) => { const yy = root.scrollTop; fn(); persist8(); persist4(); renderAll(true); root.scrollTop = keep ? yy : 0; };
  const toast = (msg) => { const t = root.querySelector('#aToast'); if (!t) return; t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2400); };
  const item = (id) => G.my.items.find((x) => String(x.id) === String(id));
  root.onclick = (e) => {
    const q = (s) => e.target.closest(s);
    let el;
    if ((el = q('[data-want]'))) {
      const c = CAT.find((x) => x.k === el.dataset.want);
      return go(() => { const i = G.my.items.findIndex((x) => x.k === c.k); if (i >= 0) G.my.items.splice(i, 1); else G.my.items.push({ id: Date.now() % 1e9, k: c.k, t: c.t, ic: c.ic, anchor: c.a, at: 17 * 60, d: c.d, imp: c.imp }); });
    }
    if (q('[data-wantadd]')) {
      const t = (root.querySelector('#wantT') || {}).value || '';
      if (!t.trim()) return toast('اكتب شنو تريد أول');
      return go(() => { G.my.items.push({ id: Date.now() % 1e9, k: 'own', t: t.trim(), ic: 'nib', anchor: 'asr', at: 17 * 60, d: 30, imp: 'normal' }); });
    }
    if ((el = q('[data-wdel]'))) return go(() => { G.my.items = G.my.items.filter((x) => String(x.id) !== el.dataset.wdel); });
    if ((el = q('[data-wanc]'))) { const [id, a] = el.dataset.wanc.split(':'); return go(() => { item(id).anchor = a; }); }
    if ((el = q('[data-wat]'))) { const [id, d] = el.dataset.wat.split(':'); return go(() => { const it = item(id); it.at = Math.max(4 * 60, Math.min(23 * 60, it.at + +d)); }); }
    if ((el = q('[data-wlen]'))) { const [id, d] = el.dataset.wlen.split(':'); return go(() => { item(id).d = +d; }); }
    if ((el = q('[data-wimp]'))) { const [id, v] = el.dataset.wimp.split(':'); return go(() => { item(id).imp = v; }); }
    if ((el = q('[data-prev8]'))) return go(() => { G.prev8 = el.dataset.prev8; });
    if (q('[data-myreset]')) { go(() => { G.my.built = false; G.page = null; G.tab = 'today'; }, false); return toast('رجع اليوم الجاهز. يومك محفوظ إذا ترجعله'); }
    if ((el = q('[data-qpin]'))) return go(() => { G.qd.pin = el.dataset.qpin === 'set' ? Math.ceil((M.t + 30) / 15) * 15 : null; });
    if ((el = q('[data-qat]'))) return go(() => { G.qd.pin = Math.max(0, G.qd.pin + +el.dataset.qat); });
    if (q('[data-qsave8]')) {
      const r = qdResolved();
      if (!r.t) return toast('اكتب المهمة أول');
      const pin = G.qd.pin;
      go(() => { G.tasks.unshift({ id: Math.max(0, ...G.tasks.map((x) => x.id)) + 1, t: r.t, d: r.d, done: false, when: r.when, pin: pin == null ? null : pin }); G.qd = { t: '', d: 30, when: 'today' }; G.add = null; });
      return toast(pin != null ? `انحطّت الساعة ${fmt(pin)}` : r.when === 'today' ? 'انحطّت بأول فراغ اليوم' : r.when === 'tomorrow' ? 'انحطّت لباچر' : 'انحطّت بالبال');
    }
    if ((el = q('[data-ob]'))) {
      const a = el.dataset.ob;
      if (a === 'loc') return base(e);
      if (a === 'next') return go(() => { G.ob = Math.min(OB8 - 1, G.ob + 1); }, false);
      if (a === 'back') return go(() => { G.ob = Math.max(0, G.ob - 1); }, false);
      if (a === 'allow') { go(() => { G.alertsOk = true; saveG('v2ok', true); syncOk(); G.ob = OB8 - 1; }, false); return; }
      if (a === 'done') return go(() => { G.ob = OB8 - 1; }, false);
      if (a === 'finish') { go(() => { G.my.built = true; G.page = null; G.tab = 'today'; G.shift = 0; G.ob = 0; }, false); return toast('يومك جاهز، وهو مالتك'); }
      if (a === 'skip') { go(() => { G.page = null; G.tab = 'today'; G.shift = 0; G.ob = 0; }, false); return toast('بديت باليوم الجاهز. تكدر تبني يومك من الإعدادات'); }
    }
    return base(e);
  };
};
