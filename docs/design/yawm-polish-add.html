<title>يوم · أضف مصقولة</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* «أضف» polished: a calm surface, white cards with a soft shadow, an icon per row, a clear type scale
   (20/17/15/13), and the part's colour only as an accent (icon tiles, the chosen part, the button).
   Built at the real size of a phone screen, not inside a drawn phone. */
:root{--bg:#EEF0F3;--surface:#F7F8FA;--card:#FFFFFF;--ink:#14171C;--ink2:#5B6270;--ink3:#8A909C;--hair:#E3E6EB;--soft:#EEF0F4;
  --shadow:0 1px 2px rgba(20,23,28,.06),0 8px 24px -12px rgba(20,23,28,.18);--ease:cubic-bezier(.23,1,.32,1);
  --acc:#2F6FA8;--acc-ink:#FFFFFF;--acc-soft:#E3EEF8;color-scheme:light;font-family:"Vazirmatn",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0C0F;--surface:#121418;--card:#1B1E24;--ink:#F1F3F6;--ink2:#A9B0BC;--ink3:#7C8492;--hair:#2A2F37;--soft:#242830;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0C0F;--surface:#121418;--card:#1B1E24;--ink:#F1F3F6;--ink2:#A9B0BC;--ink3:#7C8492;--hair:#2A2F37;--soft:#242830;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* the home peeks above the sheet, dimmed */
.peek{height:58px;background:var(--peek,#CFE3F4);position:relative;transition:background-color 300ms var(--ease)}
.peek::after{content:"";position:absolute;inset:0;background:rgba(10,12,16,.38)}
.sheet{max-width:480px;margin:-22px auto 0;position:relative;background:var(--surface);border-radius:24px 24px 0 0;min-height:calc(100dvh - 36px);
  padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 2px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.bar h1{margin:0;font-size:17px;font-weight:700;text-align:center}
.bar .x{justify-self:start;min-height:44px;padding:0 4px;color:var(--ink2);font-weight:500}
.bar .ok{justify-self:end;min-height:44px;padding:0 4px;color:var(--acc);font-weight:700;transition:color 240ms var(--ease)}
.bar .ok:disabled{color:var(--ink3);cursor:default}

.what{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:6px 16px 12px}
.what label{display:block;font-size:13px;font-weight:600;color:var(--ink3);padding-top:8px}
.what input{width:100%;border:0;background:transparent;font-size:21px;font-weight:600;padding:2px 0 4px;outline:none;caret-color:var(--acc)}
.what input::placeholder{color:var(--ink3);font-weight:500}
.ideas{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.ideas::-webkit-scrollbar{display:none}
.idea{flex:none;min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:6px}
.idea svg{width:17px;height:17px;color:var(--ink3)}

.says{margin:2px 4px 0;font-size:14px;color:var(--ink2);line-height:1.5}
.says b{color:var(--ink);font-weight:700}

.group{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px}
.row+.row,.row+.more,.more+.row{border-top:1px solid var(--hair)}
.tile{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--ink2);transition:background-color 300ms var(--ease),color 300ms var(--ease)}
.tile.acc{background:var(--acc);color:var(--acc-ink)}
.tile svg{width:20px;height:20px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.row .t small{display:block;font-size:13px;color:var(--ink3);line-height:1.4;margin-top:1px}
.row .v{font-size:15px;color:var(--ink2);font-weight:500;white-space:nowrap}
.chev{width:18px;height:18px;color:var(--ink3);transition:transform 240ms var(--ease);flex:none}
.row[aria-expanded="true"] .chev{transform:rotate(-90deg)}
.more{padding:4px 14px 14px}

/* the six parts as cards you can swipe */
.parts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:6px 14px 4px;scroll-snap-type:x proximity}
.parts::-webkit-scrollbar{display:none}
.pc{flex:none;width:96px;min-height:96px;border-radius:16px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;
  background:var(--soft);transition:background-color 220ms var(--ease),color 220ms var(--ease),box-shadow 220ms var(--ease)}
.pc i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.pc i svg{width:18px;height:18px}
.pc b{font-size:14.5px;font-weight:700;line-height:1.25}
.pc small{font-size:12px;color:var(--ink3);line-height:1.2}
.pc[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 8px 18px -10px var(--c)}
.pc[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.pc[aria-pressed="true"] i{background:rgba(255,255,255,.18)!important;color:#fff!important}
.alt{display:flex;gap:8px;margin-top:10px}
.alt button{min-height:40px;padding:0 16px;border-radius:20px;background:var(--soft);font-size:14.5px;font-weight:600;color:var(--ink2)}
.alt button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* sliding segmented */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;margin-top:6px}
.seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:9px;background:var(--card);box-shadow:0 1px 3px rgba(20,23,28,.14);transition:inset-inline-start 260ms var(--ease);width:calc((100% - 6px) / var(--n))}
.seg button{position:relative;z-index:1;min-height:38px;font-size:14.5px;font-weight:600;color:var(--ink2);text-align:center;transition:color 200ms var(--ease)}
.seg button[aria-pressed="true"]{color:var(--ink)}

/* switch */
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--hair);position:relative;transition:background-color 220ms var(--ease)}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform 260ms var(--ease)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(-20px)}

.clock{display:flex;align-items:center;justify-content:center;gap:10px;direction:ltr;padding:6px 0 2px}
.unit{display:grid;justify-items:center;gap:4px}
.unit b{font-size:46px;font-weight:600;line-height:1.05;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.unit small{font-size:12px;color:var(--ink3);font-weight:600}
.step{width:44px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--ink2)}
.step svg{width:18px;height:18px}
.colon{font-size:40px;font-weight:600;color:var(--ink3);padding-bottom:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.quick button{min-height:36px;padding:0 12px;border-radius:18px;background:var(--soft);font-size:14px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.quick button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.inpart{margin:8px 2px 0;font-size:13.5px;color:var(--ink2);text-align:center}
.inpart b{color:var(--acc)}
.go{margin-top:auto;min-height:56px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-size:17px;font-weight:700;text-align:center;
  box-shadow:0 10px 24px -12px var(--acc);transition:background-color 300ms var(--ease),transform 160ms var(--ease),opacity 200ms}
.go:active{transform:scale(.98)}
.go:disabled{opacity:.4;box-shadow:none;cursor:default}
.toast{position:fixed;inset:auto 16px calc(90px + env(safe-area-inset-bottom,0px)) 16px;max-width:448px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;animation:rise 260ms var(--ease)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="peek" id="peek"></div>
<main class="sheet" role="dialog" aria-labelledby="ttl">
  <span class="grab"></span>
  <div class="bar"><button class="x" id="cancel">إلغاء</button><h1 id="ttl">شغلة جديدة</h1><button class="ok" id="ok" disabled>حفظ</button></div>

  <div class="what"><label for="in">شنو تريد تسوي؟</label><input id="in" placeholder="اكتب هنا…" autocomplete="off" maxlength="60"></div>
  <div class="ideas" id="ideas" aria-label="أفكار جاهزة"></div>

  <div class="group">
    <button class="row" id="rWhen" aria-expanded="true" aria-controls="mWhen"><span class="tile acc" id="tWhen"></span>
      <span class="t"><b>وكتها</b><small id="sWhen"></small></span><span class="v" id="vWhen"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="more" id="mWhen"><div class="parts" id="parts"></div><div class="alt" id="alt"></div></div>
    <div class="row"><span class="tile" id="tAt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
      <span class="t"><b>بساعة محددة</b><small id="sAt">لا، بأي وكت بالقسم</small></span><button class="sw" id="swAt" role="switch" aria-checked="false" aria-label="بساعة محددة"></button></div>
    <div class="more" id="mAt" hidden>
      <div class="clock" role="group" aria-label="الساعة">
        <div class="unit"><button class="step" data-h="1" aria-label="ساعة أكثر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></button><b id="hh">16</b><button class="step" data-h="-1" aria-label="ساعة أقل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button><small>ساعة</small></div>
        <span class="colon">:</span>
        <div class="unit"><button class="step" data-m="5" aria-label="5 دقايق أكثر"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></button><b id="mm">30</b><button class="step" data-m="-5" aria-label="5 دقايق أقل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button><small>دقيقة</small></div>
      </div>
      <div class="quick" id="quick"></div>
      <p class="inpart" id="inpart"></p>
    </div>
    <button class="row" id="rRep" aria-expanded="false" aria-controls="mRep"><span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3"/><path d="M4 11V9a3 3 0 0 1 3-3h13"/><path d="M7 21l-3-3 3-3"/><path d="M20 13v2a3 3 0 0 1-3 3H4"/></svg></span>
      <span class="t"><b>يتكرر</b></span><span class="v" id="vRep"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="more" id="mRep" hidden><div class="seg" id="seg" style="--n:3"></div></div>
    <div class="row"><span class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg></span>
      <span class="t"><b>ذكّرني</b><small id="sRem"></small></span><button class="sw" id="sw" role="switch" aria-checked="true" aria-label="ذكّرني"></button></div>
  </div>
  <p class="says" id="says" aria-live="polite"></p>
  <button class="go" id="go" disabled></button>
</main>

<script>
(()=>{
document.documentElement.lang='ar';
const ICON={
 fajr:'<path d="M3 17h18M7 20.5h10M12 7.5v2M5.6 10.6l1.3 1.3M18.4 10.6l-1.3 1.3"/><path fill="currentColor" stroke="none" d="M7.4 17a4.6 4.6 0 0 1 9.2 0z"/>',
 morning:'<circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/>',
 dhuhr:'<path d="M4 19.5h16M12 3.2v1.6M5 10h1.6M17.4 10H19M7.1 5.1l1.1 1.1M16.9 5.1l-1.1 1.1M7.1 14.9l1.1-1.1M16.9 14.9l-1.1-1.1"/><circle fill="currentColor" stroke="none" cx="12" cy="10" r="3.6"/>',
 asr:'<path d="M3 19.5h18M10 19.5V8.5M5.2 1.8v1M1.3 5.8h1M2.4 3l.7.7M8 3l-.7.7"/><path fill="currentColor" stroke="none" d="M10 18.6h10.2l.6 1.8H10z"/><circle cx="5.2" cy="5.8" r="1.9"/>',
 maghrib:'<path d="M3 15.5h18M6.5 18.5h11M9.5 21h5M12 4.5v5M9.8 7.6l2.2 2.2 2.2-2.2"/><path fill="currentColor" stroke="none" d="M7.4 15.5a4.6 4.6 0 0 1 9.2 0z"/>',
 isha:'<path d="M18.6 3.6l.6 1.4 1.5.2-1.1 1 .3 1.5-1.3-.8-1.3.8.3-1.5-1.1-1 1.5-.2z"/><path fill="currentColor" stroke="none" d="M13.4 5.2A7.6 7.6 0 1 0 19.6 16a6.1 6.1 0 0 1-6.2-10.8z"/>',
 later:'<path d="M6.5 3.5h11M6.5 20.5h11M8 3.5c0 4 4 5 4 8.5s-4 4.5-4 8.5M16 3.5c0 4-4 5-4 8.5s4 4.5 4 8.5"/>',
 tom:'<rect x="3.5" y="5" width="17" height="15" rx="2.6"/><path d="M3.5 9.6h17M8 3.2v3.4M16 3.2v3.4"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;
// accent = a deeper tone of each part's colour (white text on it at 4.5:1 or more); peek = the part's own colour
const P=[['fajr','بعد الفجر','05:05','06:28','#2B4A86','#2B4A86'],['morning','الصبح','06:28','11:50','#2F6FA8','#CFE3F4'],['dhuhr','بعد الظهر','11:50','14:47','#8A6508','#F7E6A6'],
  ['asr','بعد العصر','14:47','17:07','#A35512','#E09A3E'],['maghrib','بعد المغرب','17:07','18:24','#B23F2A','#B23F2A'],['isha','بعد العشاء','18:24','22:00','#1B2347','#1B2347']];
const by=k=>P.find(p=>p[0]===k);
const S={text:'',where:'morning',rep:0,rem:true,open:'when',at:null};
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const clk=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const partOf=m=>{for(const p of P)if(m>=toMin(p[2])&&m<toMin(p[3]))return p[0];return 'isha'};
const REP=['مرة وحدة','كل يوم','أيام الدوام'];
const IDEAS=[['قرآن بعد الفجر','fajr'],['رياضة','asr'],['قراءة','isha'],['مشوار','maghrib'],['اتصال بالأهل','maghrib'],['دراسة','morning'],['شغل البيت','dhuhr'],['تسوّق','asr']];
const $=id=>document.getElementById(id);
$('ideas').innerHTML=IDEAS.map(([t,k])=>`<button class="idea" data-idea="${t}" data-k="${k}">${svg(k)}${t}</button>`).join('');
$('alt').innerHTML=`<button data-w="tom" aria-pressed="false">باچر</button><button data-w="later" aria-pressed="false">بعدين، بدون وكت</button>`;
function where(){if(S.where==='tom')return{name:'باچر',acc:'#14171C',peek:'#CFE3F4',icon:'tom',range:'يوم الجمعة'};if(S.where==='later')return{name:'بعدين',acc:'#14171C',peek:'#CFE3F4',icon:'later',range:'بدون وكت، تلكاها تحت يومك'};
  const p=by(S.where);return{name:p[1],acc:p[4],peek:p[5],icon:p[0],range:`${p[2]} – ${p[3]}`}}
function render(){const w=where();const r=document.documentElement.style;r.setProperty('--acc',w.acc);$('peek').style.setProperty('--peek',w.peek);
  $('tWhen').innerHTML=svg(w.icon);$('vWhen').textContent=w.name;$('sWhen').textContent=w.range;
  $('parts').innerHTML=P.map(([k,n,a,b,acc])=>`<button class="pc" data-w="${k}" aria-pressed="${S.where===k}" style="--c:${acc}"><i style="background:color-mix(in srgb,${acc} 14%,transparent);color:${acc}">${svg(k)}</i><span><b>${n}</b><br><small class="num">${a} – ${b}</small></span></button>`).join('');
  $('alt').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',S.where===b.dataset.w));
  const timed=S.at!==null;$('swAt').setAttribute('aria-checked',timed);$('mAt').hidden=!timed;
  $('tAt').classList.toggle('acc',timed);
  $('sAt').textContent=timed?`الساعة ${clk(S.at)}`:'لا، بأي وكت بالقسم';
  if(timed){$('hh').textContent=String(Math.floor(S.at/60)).padStart(2,'0');$('mm').textContent=String(S.at%60).padStart(2,'0');
    $('inpart').innerHTML=S.where==='tom'?`باچر، الساعة <b>${clk(S.at)}</b>`:`هاي الساعة تصير <b>${by(S.where)[1]}</b>`;
    $('quick').innerHTML=['07:00','08:30','13:00','16:30','19:00','21:00'].map(t=>`<button data-q="${t}" aria-pressed="${clk(S.at)===t}">${t}</button>`).join('')}
  $('vRep').textContent=REP[S.rep];
  $('seg').innerHTML=`<span class="thumb" style="inset-inline-start:calc(3px + ${S.rep} * (100% - 6px) / 3)"></span>`+REP.map((t,i)=>`<button data-rep="${i}" aria-pressed="${S.rep===i}">${t}</button>`).join('');
  $('sw').setAttribute('aria-checked',S.rem);$('sRem').textContent=S.where==='later'?'ما ينبّه، لأن ما إلها وكت':!S.rem?'بدون تنبيه':timed?`الساعة ${clk(S.at)} بالضبط`:'بأول القسم، بإشعار هادي';
  const has=S.text.trim().length>0;const lbl=w.name.startsWith('ال')?'ب'+w.name:w.name;
  $('go').textContent=has?(S.at!==null?`حطّها الساعة ${clk(S.at)}`:`حطّها ${lbl}`):'اكتب شنو تريد تسوي';$('go').disabled=!has;$('ok').disabled=!has;
  $('says').innerHTML=has?`<b>«${S.text.trim()}»</b> ${S.where==='later'?'تنحط بعدين، بدون وكت.':(timed?`الساعة ${clk(S.at)}، ${lbl}، ${REP[S.rep]}${S.rem?'، وأذكّرك بوكتها':''}.`:`${lbl}، ${REP[S.rep]}${S.rem?'، وأذكّرك بأوله':''}.`)}`:'اكتب، أو اختار فكرة من فوق.';
  for(const [row,m] of [['rWhen','mWhen'],['rRep','mRep']]){const open=(row==='rWhen'&&S.open==='when')||(row==='rRep'&&S.open==='rep');$(row).setAttribute('aria-expanded',open);$(m).hidden=!open}}
$('in').addEventListener('input',e=>{S.text=e.target.value;render()});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.idea){S.text=b.dataset.idea;$('in').value=S.text;S.where=b.dataset.k;render();return}
  if(b.dataset.w){S.where=b.dataset.w;if(S.where==='later'){S.rem=false;S.at=null}
    else if(S.at!==null&&partOf(S.at)!==S.where&&by(S.where))S.at=toMin(by(S.where)[2])+30;render();return}
  const follow=()=>{if(S.where!=='tom')S.where=partOf(S.at)};
  if(b.id==='swAt'){if(S.where==='later')return;S.at=S.at===null?(by(S.where)?toMin(by(S.where)[2])+30:16*60+30):null;if(S.at!==null)follow();render();return}
  if(b.dataset.h){S.at=(S.at+60*+b.dataset.h+1440)%1440;follow();render();return}
  if(b.dataset.m){S.at=(S.at+ +b.dataset.m+1440)%1440;follow();render();return}
  if(b.dataset.q){S.at=toMin(b.dataset.q);follow();render();return}
  if(b.dataset.rep){S.rep=+b.dataset.rep;render();return}
  if(b.id==='rWhen'){S.open=S.open==='when'?null:'when';render();return}
  if(b.id==='rRep'){S.open=S.open==='rep'?null:'rep';render();return}
  if(b.id==='sw'){if(S.where!=='later')S.rem=!S.rem;render();return}
  if(b.id==='cancel'){S.text='';$('in').value='';render();return}
  if((b.id==='go'||b.id==='ok')&&S.text.trim()){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=`انضافت «${S.text.trim()}»`;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}});
render();
})();
</script>
