<title>يوم · البحث والتصاميم</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap">
<style>
/* Built on the research (tab «البحث»): an everyday app wins by earned familiarity (Impeccable, Operate
   mode); the one key action is made bigger, coloured and shaped (Material 3 Expressive study, ACM 2026);
   habits are tied to a cue, here the prayers (implementation intentions); progress forgives a missed
   day; a calm visual day (Tiimo, iPhone App of the Year 2025); a home-screen widget (Pillars, 1.6M users).
   Arabic body text at line-height 1.7+. Drawn icons only, no glyphs. */
:root{--ease:cubic-bezier(.2,0,0,1);--spring:cubic-bezier(.34,1.4,.64,1);color-scheme:light;font-family:"Vazirmatn",Tahoma,sans-serif}
*{box-sizing:border-box}
html{direction:rtl}
body{margin:0;min-height:100dvh;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;background:#F4F4F1;color:#17191D}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid #1F6FEB;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;display:block;flex:none}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.pick{position:sticky;top:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:rgba(18,19,22,.9);backdrop-filter:blur(12px)}
.pick button{min-height:44px;border-radius:12px;color:#C8CBD1;font-size:13.5px;font-weight:700;text-align:center;line-height:1.2}
.pick button[aria-pressed="true"]{background:#fff;color:#111}
.d{display:none}.d.on{display:block;animation:in 260ms var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* shared bits */
.chk{flex:none;width:28px;height:28px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line,#CFCFCA);display:grid;place-items:center;transition:background-color 180ms var(--ease),box-shadow 180ms}
.chk svg{width:18px;height:18px;color:#fff;opacity:0;transform:scale(.5);transition:opacity 160ms,transform 260ms var(--spring)}
.done .chk,.chk[aria-checked="true"]{background:var(--acc);box-shadow:none}
.done .chk svg,.chk[aria-checked="true"] svg{opacity:1;transform:none}
.nav{position:sticky;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--navbg,#fff);border-top:1px solid var(--line,#E6E6E1)}
.nav button{display:grid;justify-items:center;gap:2px;min-height:56px;font-size:12px;font-weight:700;color:var(--ink3,#6A6E76)}
.nav button span{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;transition:background-color 200ms}
.nav button[aria-current="page"]{color:var(--ink,#17191D)}
.nav button[aria-current="page"] span{background:var(--sel,#E9E9E4)}

/* ── 1 هادي ── */
#D1{--acc:#1E6B52;--ink:#17191D;--ink2:#4C5059;--ink3:#686C74;--line:#E3E3DE;--bg:#F7F7F4;background:var(--bg);min-height:100dvh}
#D1 .top{padding:18px 18px 8px}
#D1 .top small{display:block;font-size:13.5px;color:var(--ink3);font-weight:600}
#D1 .next{margin:6px 14px 0;background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 22px -14px rgba(0,0,0,.18)}
#D1 .next .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
#D1 .next h1{margin:0;font-size:30px;font-weight:900;line-height:1.3}
#D1 .next p{margin:0;font-size:15px;color:var(--ink2);font-weight:600}
#D1 .count{font-size:30px;font-weight:800;color:var(--acc);line-height:1.2}
#D1 .five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
#D1 .p{display:grid;justify-items:center;gap:4px;border-radius:12px;padding:8px 2px;min-height:76px;background:#F3F3EF;font-size:12.5px;font-weight:700;color:var(--ink2)}
#D1 .p b{font-size:14px;color:var(--ink)}
#D1 .p .chk{width:24px;height:24px;border-radius:7px}
#D1 .p.cur{background:#E4F1EB;box-shadow:inset 0 0 0 2px var(--acc)}
#D1 .h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 18px 6px;font-size:15px;font-weight:800}
#D1 .h small{font-size:13px;color:var(--ink3);font-weight:600}
#D1 .list{margin:0 14px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
#D1 .it{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;width:100%}
#D1 .it+.it{border-top:1px solid var(--line)}
#D1 .it .t{flex:1}#D1 .it b{display:block;font-size:16px;font-weight:700;line-height:1.4}
#D1 .it small{font-size:13px;color:var(--ink3)}
#D1 .it.done b{color:var(--ink3);font-weight:500}
#D1 .it .tm{font-size:14px;font-weight:700;color:var(--ink2)}
#D1 .add{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border-top:1px solid var(--line);color:var(--acc);font-weight:700}
#D1 .later{margin:6px 14px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
#D1 .later button{flex:none;min-height:44px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;font-weight:600;color:var(--ink2)}
#D1 .week{margin:18px 14px 90px;background:#fff;border-radius:16px;padding:14px 16px}
#D1 .week b{font-size:15.5px}
#D1 .week p{margin:2px 0 10px;font-size:14px;color:var(--ink2)}
#D1 .dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
#D1 .dots i{height:34px;border-radius:9px;background:#E4F1EB;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:var(--acc)}
#D1 .dots i.miss{background:#F3F3EF;color:var(--ink3)}
#D1 .dots i.today{box-shadow:inset 0 0 0 2px var(--acc)}
#D1 .widget{margin:14px;border-radius:24px;background:#24312C;color:#E8F2ED;padding:18px;display:grid;gap:4px}
#D1 .widget small{font-size:12.5px;opacity:.85;font-weight:600}
#D1 .widget b{font-size:28px;font-weight:900;line-height:1.2}

/* ── 2 تعبيري ── */
#D2{--acc:#8A4B08;--on:#fff;--cont:#FFDDB8;--oncont:#2E1500;--surf:#FFF8F2;--surf2:#FBEBDD;--ink:#211A14;--ink2:#52443A;--ink3:#6B5B4E;--line:#E9D9CB;--navbg:#FBEBDD;--sel:#FFDDB8;background:var(--surf);min-height:100dvh;color:var(--ink)}
#D2 .hero{padding:18px 18px 4px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
#D2 .hero small{font-size:14px;font-weight:700;color:var(--ink2)}
#D2 .hero h1{margin:0;font-size:44px;font-weight:900;line-height:1.25}
#D2 .cookie{width:96px;height:96px;color:var(--cont);position:relative;display:grid;place-items:center}
#D2 .cookie svg.s{position:absolute;inset:0;width:100%;height:100%;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#D2 .cookie svg.i{position:relative;width:40px;height:40px;color:var(--oncont)}
#D2 .wave{margin:6px 18px 0}
#D2 .wave svg{width:100%;height:24px;display:block}
#D2 .wave p{margin:0;display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--ink2)}
#D2 .big{margin:14px 14px 0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:var(--cont);color:var(--oncont);border-radius:28px;padding:18px}
#D2 .big b{display:block;font-size:22px;font-weight:900;line-height:1.3}
#D2 .big small{font-size:14px;font-weight:600}
#D2 .pray{min-height:64px;padding:0 26px;border-radius:32px;background:var(--acc);color:var(--on);font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;transition:border-radius 300ms var(--spring),transform 160ms var(--ease)}
#D2 .pray:active{border-radius:14px;transform:scale(.97)}
#D2 .pray[aria-pressed="true"]{background:transparent;color:var(--oncont);box-shadow:inset 0 0 0 2px var(--oncont)}
#D2 .grp{margin:16px 14px 0;display:grid;gap:3px}
#D2 .grp h2{margin:0 6px 6px;font-size:15px;font-weight:800;color:var(--ink2)}
#D2 .it{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px;background:#fff;width:100%;border-radius:8px;transition:border-radius 260ms var(--spring)}
#D2 .grp .it:first-of-type{border-radius:24px 24px 8px 8px}#D2 .grp .it:last-of-type{border-radius:8px 8px 24px 24px}
#D2 .it:active{border-radius:24px}
#D2 .it .t{flex:1}#D2 .it b{display:block;font-size:16.5px;font-weight:800;line-height:1.4}#D2 .it small{font-size:13.5px;color:var(--ink3)}
#D2 .it.done b{color:var(--ink3);font-weight:600}
#D2 .sh{width:40px;height:40px;display:grid;place-items:center;color:var(--acc);background:var(--surf2)}
#D2 .sh svg{width:22px;height:22px}
#D2 .sh.a{border-radius:50%}#D2 .sh.b{border-radius:12px}#D2 .sh.c{border-radius:40% 60% 55% 45% / 50% 45% 55% 50%}
#D2 .split{display:flex;gap:3px}
#D2 .split button{min-height:56px;background:var(--acc);color:var(--on);font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
#D2 .fabwrap{position:sticky;bottom:86px;z-index:20;display:flex;justify-content:flex-start;padding:0 16px;pointer-events:none;margin-top:16px}
#D2 .split{pointer-events:auto;box-shadow:0 10px 24px -10px rgba(90,40,0,.6);border-radius:20px}
#D2 .split .m{border-radius:20px 8px 8px 20px;padding:0 22px}
#D2 .split .s{border-radius:8px 20px 20px 8px;width:56px;justify-content:center}

/* ── 3 مرئي ── */
#D3{--acc:#3D5AFE;--ink:#15171C;--ink2:#4A4F5A;--ink3:#666B76;--line:#E5E6EC;background:#FBFBFD;min-height:100dvh}
#D3 .head{padding:18px 18px 6px;display:flex;justify-content:space-between;align-items:flex-end}
#D3 .head h1{margin:0;font-size:26px;font-weight:900;line-height:1.3}
#D3 .head small{font-size:13.5px;color:var(--ink3);font-weight:600}
#D3 .nowc{margin:8px 14px 0;border-radius:24px;background:var(--bgc);padding:18px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
#D3 .timer{width:96px;height:96px}
#D3 .nowc small{font-size:13px;font-weight:800;color:var(--fgc);opacity:.8}
#D3 .nowc b{display:block;font-size:24px;font-weight:900;line-height:1.3;color:var(--fgc)}
#D3 .nowc p{margin:2px 0 10px;font-size:14px;font-weight:600;color:var(--fgc);opacity:.85}
#D3 .nowc .acts{display:flex;gap:8px}
#D3 .nowc .acts button{min-height:46px;padding:0 16px;border-radius:14px;font-weight:800;font-size:15px}
#D3 .ok{background:var(--fgc);color:var(--bgc)}
#D3 .lt{background:rgba(255,255,255,.55);color:var(--fgc)}
#D3 .flow{position:relative;margin:16px 14px 0;padding-inline-start:0}
#D3 .blk{display:grid;grid-template-columns:54px 1fr;gap:10px;margin-bottom:8px}
#D3 .blk .tm{font-size:13px;font-weight:800;color:var(--ink3);padding-top:14px;text-align:center}
#D3 .card{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;background:var(--bgc);color:var(--fgc);min-height:var(--h,58px);width:100%}
#D3 .card .ic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.6);display:grid;place-items:center;flex:none}
#D3 .card .t{flex:1}#D3 .card b{display:block;font-size:16px;font-weight:800;line-height:1.4}#D3 .card small{font-size:13px;font-weight:600;opacity:.85}
#D3 .card.done{opacity:.55}
#D3 .card .chk{--line:rgba(0,0,0,.18);--acc:var(--fgc)}
#D3 .anchor{display:flex;align-items:center;gap:8px;margin:14px 0 8px 0;font-size:13.5px;font-weight:800;color:var(--ink2)}
#D3 .anchor::after{content:"";flex:1;height:1.5px;background:var(--line)}
#D3 .anchor svg{width:18px;height:18px}
#D3 .dump{margin:16px 14px 100px;border-radius:24px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 26px -16px rgba(0,0,0,.25);padding:16px}
#D3 .dump b{font-size:16px;font-weight:800}
#D3 .dump p{margin:2px 0 10px;font-size:14px;color:var(--ink2)}
#D3 textarea{width:100%;min-height:86px;border:0;border-radius:14px;background:#F2F3F7;padding:12px;font:inherit;font-size:15.5px;line-height:1.7;resize:none;outline:none}
#D3 .dump .go{margin-top:10px;width:100%;min-height:52px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;text-align:center}
#D3 .res{display:grid;gap:6px;margin-top:12px}
#D3 .res div{display:flex;gap:10px;align-items:center;font-size:14.5px;font-weight:700;padding:8px 10px;border-radius:12px;background:#F2F3F7}
#D3 .res div span{font-size:12.5px;font-weight:800;color:#fff;background:var(--c);border-radius:8px;padding:1px 8px;white-space:nowrap}

/* ── 4 المنحنى (Apple Design Awards 2026: Tide Guide's sky palette and full-screen chart, Moonlitt's touch) ── */
#D4{--ink:#121821;--ink2:#46505E;--ink3:#5F6875;--line:#E2E6EC;--acc:#B5651D;background:#F5F7FA;min-height:100dvh}
#D4 .chart{position:relative;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 14px;background:linear-gradient(180deg,var(--c1),var(--c2));transition:background 400ms}
#D4 .chart .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
#D4 .chart small{font-size:13.5px;font-weight:600;opacity:.92}
#D4 .chart h1{margin:0;font-size:34px;font-weight:900;line-height:1.25}
#D4 .chart .tm{font-size:34px;font-weight:800;line-height:1.25}
#D4 .chart svg{display:block;width:100%;height:auto;margin-top:6px;touch-action:none;cursor:ew-resize}
#D4 .chart svg text{font-family:Vazirmatn;font-size:11px;font-weight:700;fill:#fff}
#D4 .hint{font-size:12.5px;font-weight:600;opacity:.9;text-align:center;margin:2px 0 0}
#D4 .here{margin:12px 14px 0;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 22px -14px rgba(0,0,0,.18)}
#D4 .here .row{display:flex;align-items:center;gap:12px}
#D4 .here .t{flex:1}#D4 .here b{display:block;font-size:19px;font-weight:900;line-height:1.35}#D4 .here small{font-size:13.5px;color:var(--ink3);font-weight:600}
#D4 .pray4{min-height:56px;padding:0 22px;border-radius:28px;background:var(--acc);color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;gap:6px}
#D4 .pray4[aria-pressed="true"]{background:#EEF1F5;color:var(--ink2)}
#D4 .list{margin:10px 0 0;display:grid;gap:2px}
#D4 .it{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;border-top:1px solid var(--line);padding-top:6px}
#D4 .it .t b{font-size:16px;font-weight:700}#D4 .it.done b{color:var(--ink3);font-weight:500}
#D4 .it .tm{font-size:14px;font-weight:700;color:var(--ink2)}
#D4 .wg{margin:16px 14px 90px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#D4 .wg div{border-radius:22px;padding:14px;color:#fff;background:linear-gradient(180deg,#3C5E96,#C98A55)}
#D4 .wg small{font-size:12px;font-weight:700;opacity:.9}#D4 .wg b{display:block;font-size:22px;font-weight:900;line-height:1.3}
#D4 .wg svg{width:100%;height:40px;display:block;margin-top:6px}

/* ── research ── */
#R{background:#fff;min-height:100dvh;padding:18px 18px 60px}
#R h1{margin:0 0 4px;font-size:26px;font-weight:900;line-height:1.35}
#R .lead{margin:0 0 14px;color:#4C5059;font-size:15.5px}
#R section{border-top:1px solid #E6E6E1;padding:14px 0}
#R h2{margin:0 0 4px;font-size:17px;font-weight:800;line-height:1.5}
#R p{margin:0;font-size:15px;color:#33363C}
#R .src{display:block;margin-top:4px;font-size:12.5px;color:#5A5F68;word-break:break-word}
#R .src a{color:#1F5FB8}
#R .use{margin-top:6px;font-size:14.5px;font-weight:700;color:#1E6B52}
</style>

<div class="app">
  <div class="pick" role="group" aria-label="اختار"><button data-d="R" aria-pressed="false">البحث</button><button data-d="D1" aria-pressed="true">١ · هادي</button><button data-d="D2" aria-pressed="false">٢ · تعبيري</button><button data-d="D3" aria-pressed="false">٣ · مرئي</button><button data-d="D4" aria-pressed="false">٤ · المنحنى</button></div>
  <section class="d" id="R" aria-label="البحث"></section>

  <section class="d" id="D2" aria-label="تعبيري"></section>
  <section class="d" id="D3" aria-label="مرئي"></section>
  <section class="d" id="D4" aria-label="المنحنى"></section>
</div>
