<title>يوم · السما</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap">
<style>
/* «السما»: the prayers are set by the sun, so the top of every screen is the sky of this minute in your
   city, with the sun's arc and the five prayers on it. Below the sky, one calm language everywhere:
   white cards, soft shadows, an icon per row, rounded-square ticks, the part's colour only as an accent. */
:root{--bg:#F2F4F7;--card:#FFFFFF;--ink:#12161C;--ink2:#4F5764;--ink3:#626B78;--hair:#E5E8ED;--soft:#EEF1F5;
  --shadow:0 1px 2px rgba(18,22,28,.05),0 10px 28px -14px rgba(18,22,28,.22);--ease:cubic-bezier(.23,1,.32,1);
  --acc:#A35512;color-scheme:light;font-family:"Vazirmatn",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C0E12;--card:#181B21;--ink:#F1F3F6;--ink2:#B3BAC5;--ink3:#98A0AD;--hair:#2A2F37;--soft:#22262D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C0E12;--card:#181B21;--ink:#F1F3F6;--ink2:#B3BAC5;--ink3:#98A0AD;--hair:#2A2F37;--soft:#22262D;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block;animation:fade 260ms var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}

/* the sky */
.sky{position:relative;color:var(--sky-ink);padding:calc(14px + env(safe-area-inset-top,0px)) 18px 64px;overflow:hidden;
  background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 58%,var(--s3) 100%);transition:color 600ms var(--ease)}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--sx) var(--sy),var(--glow) 0,transparent 42%);pointer-events:none;transition:background 600ms}
.stars{position:absolute;inset:0;opacity:var(--stars);transition:opacity 800ms;pointer-events:none}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.8}
.ridge{position:absolute;inset:auto 0 0 0;height:54px;pointer-events:none}
.ridge path{transition:fill 600ms}
.top{position:relative;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;min-height:44px}
.top span{flex:1;opacity:.92}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.iconbtn svg{width:22px;height:22px}
.arc{position:relative;display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.arc text{font-family:"Vazirmatn";font-size:11px;font-weight:700;fill:currentColor}
.hero{position:relative;margin-top:-6px}
.hero h1{margin:0;font-size:40px;font-weight:900;line-height:1.1;letter-spacing:0}
.hero p{margin:4px 0 0;font-size:16.5px;font-weight:600;opacity:.95}

/* cards below the sky */
.below{position:relative;margin-top:-44px;padding:0 14px;display:grid;gap:12px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.next{display:flex;align-items:center;gap:12px;padding:14px 16px}
.next .t{flex:1}
.next b{display:block;font-size:17px;font-weight:800}
.next small{font-size:13.5px;color:var(--ink3);font-weight:500}
.pill{min-height:44px;padding:0 16px;border-radius:22px;font-size:15px;font-weight:700;background:var(--acc);color:#fff;display:inline-flex;align-items:center;gap:6px;transition:transform 160ms var(--ease),background-color 300ms}
.pill:active{transform:scale(.97)}
.pill.ghost{background:var(--soft);color:var(--ink2)}
.tile{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--acc)) 14%,transparent);color:var(--c,var(--acc))}
.tile svg{width:21px;height:21px}
.tile.solid{background:var(--c,var(--acc));color:#fff}
.h{margin:8px 4px -2px;font-size:14px;font-weight:700;color:var(--ink3)}

/* the day: parts as cards */
.part{overflow:hidden}
.ph{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;min-height:64px}
.ph .t{flex:1;min-width:0}
.ph b{display:block;font-size:16.5px;font-weight:800;line-height:1.3}
.ph small{font-size:13px;color:var(--ink3);font-weight:500}
.ph .cnt{font-size:13.5px;font-weight:700;color:var(--ink2);background:var(--soft);border-radius:10px;padding:2px 9px}
.ph .now{font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:8px;padding:2px 8px}
.part.past .ph{opacity:.62}
.rows{border-top:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:8px 14px}
.row+.row{border-top:1px solid var(--hair)}
.tick{flex:none;width:30px;height:30px;border-radius:9px;box-shadow:inset 0 0 0 2px var(--hair);display:grid;place-items:center;transition:background-color 200ms var(--ease),box-shadow 200ms}
.tick svg{width:18px;height:18px;color:#fff;opacity:0;transform:scale(.6);transition:opacity 200ms,transform 260ms var(--ease)}
.row.done .tick{background:var(--c);box-shadow:none}
.row.done .tick svg{opacity:1;transform:none}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:700;line-height:1.35}
.row.done b{color:var(--ink3);font-weight:500;text-decoration:line-through;text-decoration-thickness:1.5px}
.row small{font-size:13px;color:var(--ink3)}
.row .at{font-size:15px;font-weight:700;color:var(--ink2)}
.addrow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;border-top:1px solid var(--hair);color:var(--c);font-weight:700;font-size:15px}
.addrow i{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,transparent);font-size:20px}

/* bottom bar */
.nav{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.nav nav{pointer-events:auto;width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;
  background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--hair);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:grid;justify-items:center;gap:2px;min-height:52px;font-size:12px;font-weight:600;color:var(--ink3)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .plus{width:60px;height:60px;border-radius:20px;background:var(--acc);color:#fff;display:grid;place-items:center;margin:-26px auto 0;box-shadow:0 12px 24px -10px var(--acc);transition:background-color 400ms,transform 160ms var(--ease)}
.nav .plus:active{transform:scale(.95)}
.nav .plus svg{width:28px;height:28px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,10,14,.42);opacity:0;pointer-events:none;transition:opacity 240ms}
.sheet{position:fixed;z-index:31;inset:auto 0 0 0;max-width:480px;margin:0 auto;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform 320ms var(--ease);display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
body.open .scrim{opacity:1;pointer-events:auto}
body.open .sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--hair);margin:0 auto 2px;flex:none}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;flex:none}
.sbar h2{margin:0;font-size:17px;font-weight:800;text-align:center}
.sbar .x{justify-self:start;min-height:44px;color:var(--ink2);font-weight:600}
.sbar .ok{justify-self:end;min-height:44px;color:var(--acc);font-weight:800}
.field{padding:8px 16px 12px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink3);padding-top:4px}
.field input{width:100%;border:0;background:transparent;font-size:21px;font-weight:700;padding:2px 0;outline:none;caret-color:var(--acc)}
.field input::placeholder{color:var(--ink3);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip.acc{background:var(--acc);color:#fff}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 14px}
.opt+.opt{border-top:1px solid var(--hair)}
.opt .t{flex:1}.opt b{display:block;font-size:16px;font-weight:700}.opt small{font-size:13px;color:var(--ink3)}
.opt .v{font-size:15px;color:var(--ink2);font-weight:600}
.parts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 14px}
.parts::-webkit-scrollbar{display:none}
.pc{flex:none;width:98px;min-height:98px;border-radius:16px;padding:10px;background:var(--soft);display:flex;flex-direction:column;justify-content:space-between;text-align:start;transition:background-color 220ms,color 220ms}
.pc .tile{width:30px;height:30px;border-radius:9px}.pc .tile svg{width:18px;height:18px}
.pc b{font-size:14.5px;font-weight:800;line-height:1.25}.pc small{font-size:12px;color:var(--ink3)}
.pc[aria-pressed="true"]{background:var(--c);color:#fff}.pc[aria-pressed="true"] small{color:rgba(255,255,255,.88)}
.pc[aria-pressed="true"] .tile{background:rgba(255,255,255,.2);color:#fff}
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--hair);position:relative;transition:background-color 220ms}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform 260ms var(--ease)}
.sw[aria-checked="true"]{background:var(--acc)}.sw[aria-checked="true"]::after{transform:translateX(-20px)}
.go{min-height:56px;border-radius:16px;background:var(--acc);color:#fff;font-size:17px;font-weight:800;text-align:center;box-shadow:0 12px 24px -12px var(--acc);flex:none;transition:transform 160ms var(--ease)}
.go:active{transform:scale(.98)}
.says{margin:0 4px;font-size:14px;color:var(--ink2)}

/* assistant */
.chat{display:grid;gap:10px;padding:4px 14px 8px}
.me,.it{max-width:86%;padding:10px 14px;border-radius:18px;font-size:15.5px;animation:fade 260ms var(--ease)}
.me{justify-self:start;background:var(--ink);color:var(--bg);border-end-start-radius:6px}
.it{justify-self:end;background:var(--card);box-shadow:var(--shadow);color:var(--ink2);border-end-end-radius:6px}
.ask{justify-self:stretch;padding:12px 14px}
.ask dl{margin:6px 0 10px;display:grid;gap:2px}.ask dl div{display:flex;justify-content:space-between;font-size:14.5px;padding:5px 0;border-bottom:1px solid var(--hair)}
.ask dl div:last-child{border:0}.ask dt{color:var(--ink3)}.ask dd{margin:0;font-weight:700}
.askbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.askbtns button{min-height:46px;border-radius:13px;font-weight:800}
.say{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;padding:8px 14px}
.say input{flex:1;min-height:52px;border-radius:26px;border:0;background:var(--card);box-shadow:var(--shadow);padding:0 18px;font-size:16px;outline:none}
.mic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--soft);flex:none}
.mic.on{background:#C62E2E;color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(198,46,46,.18)}}
.mic svg{width:22px;height:22px}

/* week, settings, night */
.days{display:grid;gap:8px;padding:0 14px}
.day{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:12px 14px;min-height:66px;width:100%;text-align:start}
.day b{font-size:15.5px;font-weight:800}.day small{display:block;font-size:12.5px;color:var(--ink3)}
.day.today{box-shadow:var(--shadow),inset 0 0 0 2px var(--acc)}
.dots{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px}
.dots i{flex:1;border-radius:3px;opacity:.28}.dots i.has{opacity:1}
.ring{width:42px;height:42px}
.group{margin:0 14px}
.sleep{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.18);margin-top:14px}
.sleep i{background:#fff}.sleep i+i{background:rgba(255,255,255,.55)}

/* first run */
.first{position:fixed;inset:0;z-index:40;display:none;flex-direction:column}
.first.on{display:flex}
.first .sky{flex:1;display:flex;flex-direction:column;padding-bottom:28px}
.steps{display:flex;gap:6px;position:relative}.steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}.steps i.on{background:#fff}
.first .arc{margin-top:18px}
.first h1{position:relative;font-size:38px;font-weight:900;margin:auto 0 6px;line-height:1.15}
.first p{position:relative;margin:0;font-size:17px;font-weight:500;opacity:.95}
.first .panel{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-22px;position:relative;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}

/* time scrubber (only in this preview) */
.scrub{position:fixed;z-index:25;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);box-shadow:0 8px 24px -8px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px;
  background:rgba(12,14,18,.62);color:#fff;backdrop-filter:blur(10px);border-radius:22px;padding:4px 6px 4px 12px;font-size:13px;font-weight:700}
.scrub button{min-height:36px;padding:0 10px;border-radius:16px;background:rgba(255,255,255,.16);font-weight:700}
.scrub input{width:110px;accent-color:#fff}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <section class="view on" id="v-today" aria-label="اليوم"></section>
  <section class="view" id="v-week" aria-label="الأسبوع"></section>
  <section class="view" id="v-ai" aria-label="المساعد"></section>
  <section class="view" id="v-set" aria-label="الإعدادات"></section>
</div>
<div class="nav"><nav aria-label="التنقّل">
  <button data-go="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M7 20.5h10"/><path d="M7.4 17a4.6 4.6 0 0 1 9.2 0"/><path d="M12 7.5v2M5.6 10.6l1.3 1.3M18.4 10.6l-1.3 1.3"/></svg>اليوم</button>
  <button data-go="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.6"/><path d="M3.5 9.6h17M8 3.2v3.4M16 3.2v3.4"/></svg>الأسبوع</button>
  <button class="plus" data-open="add" aria-label="أضف"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-go="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>المساعد</button>
  <button data-go="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>الإعدادات</button>
</nav></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="s-add" role="dialog" aria-label="شغلة جديدة"></div>
<div class="first" id="first" role="dialog" aria-label="أول تشغيل"></div>
<div class="scrub" id="scrub" aria-label="جرّب وكت ثاني"><span id="clock" class="num">15:10</span><input id="tm" type="range" min="270" max="1439" step="5" value="910" aria-label="الوكت"><button id="play">▶ اليوم كله</button><button id="fr">أول تشغيل</button></div>

<script>
(()=>{
document.documentElement.lang='ar';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0'),clk=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+':'+pad(((m%60)+60)%60);
const dur=m=>{const h=Math.floor(m/60),mi=m%60;const hs=h===1?'ساعة':h===2?'ساعتين':`${h} ساعات`;return h&&mi?`${hs} و${mi} دقيقة`:h?hs:`${mi} دقيقة`};
// Sulaymaniyah, Friday 6 November 2026 (Egyptian method): the six parts and the night.
const T={fajr:305,sunrise:389,dhuhr:710,asr:887,maghrib:1027,isha:1104,bed:1320,nextFajr:1745};
const ICON={fajr:'<path d="M3 17h18M7 20.5h10M12 7.5v2M5.6 10.6l1.3 1.3M18.4 10.6l-1.3 1.3"/><path fill="currentColor" stroke="none" d="M7.4 17a4.6 4.6 0 0 1 9.2 0z"/>',
 morning:'<circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/>',
 dhuhr:'<path d="M4 19.5h16M12 3.2v1.6M5 10h1.6M17.4 10H19M7.1 5.1l1.1 1.1M16.9 5.1l-1.1 1.1"/><circle fill="currentColor" stroke="none" cx="12" cy="10" r="3.6"/>',
 asr:'<path d="M3 19.5h18M10 19.5V8.5M5.2 1.8v1M1.3 5.8h1M2.4 3l.7.7M8 3l-.7.7"/><path fill="currentColor" stroke="none" d="M10 18.6h10.2l.6 1.8H10z"/><circle cx="5.2" cy="5.8" r="1.9"/>',
 maghrib:'<path d="M3 15.5h18M6.5 18.5h11M9.5 21h5M12 4.5v5M9.8 7.6l2.2 2.2 2.2-2.2"/><path fill="currentColor" stroke="none" d="M7.4 15.5a4.6 4.6 0 0 1 9.2 0z"/>',
 isha:'<path d="M18.6 3.6l.6 1.4 1.5.2-1.1 1 .3 1.5-1.3-.8-1.3.8.3-1.5-1.1-1 1.5-.2z"/><path fill="currentColor" stroke="none" d="M13.4 5.2A7.6 7.6 0 1 0 19.6 16a6.1 6.1 0 0 1-6.2-10.8z"/>',

  <div class="card">${row('spark','عن «يوم»','بلا حساب، بلا إعلانات، وما يفتي','')}</div></div>`}
// ── first run ───────────────────────────────────────────────────────
let step=0;function first(){const S=[{p:P[0],t:T.fajr+30,h:'هلا بيك بـ«يوم»',d:'يرتّب يومك بين الصلوات، ويذكّرك بوكت كل شي. كلشي يبقى بتلفونك.'},{p:P[1],t:600,h:'شوكت تنام؟',d:'حتى نحسب نومك وصلاة الليل كل ليلة.'},{p:P[3],t:950,h:'خلّي ينبّهك',d:'حتى يأذّن بوكت كل صلاة ويرن المنبّه بالدقيقة.'}];const s=S[step];setAccent(s.p);
  const body=step===0?`<div class="card">${['السليمانية','أربيل','بغداد','البصرة'].map((c,i)=>`<button class="opt"><span class="tile ${i===0?'solid':''}">${svg('pin')}</span><span class="t"><b>${c}</b></span>${i===0?`<span style="color:var(--acc)">${svg('check',2.6)}</span>`:''}</button>`).join('')}<button class="opt"><span class="tile">${svg('spark')}</span><span class="t"><b>موقعي الحالي</b><small>تقريبي، يبقى على تلفونك</small></span></button></div>`
    :step===1?`<div class="card opt" style="justify-content:center;gap:18px;direction:ltr"><button class="pill ghost">−15د</button><b class="num" style="font-size:44px">22:00</b><button class="pill ghost">+15د</button></div><p class="says">تنام 22:00 وتصحى 04:46 لصلاة الليل. نومك 6:46 وقيلولة 20 دقيقة.</p>`
    :`<div class="card"><div class="opt"><span class="tile solid">${svg('bell')}</span><span class="t"><b>الإشعارات</b><small>للأذان وبداية كل قسم</small></span><span class="sw" role="switch" aria-checked="true"></span></div><div class="opt"><span class="tile solid">${svg('clock')}</span><span class="t"><b>المنبّهات بالدقيقة</b><small>حتى يرن بوكته بالضبط</small></span><span class="sw" role="switch" aria-checked="false"></span></div></div>`;
  $('first').innerHTML=`<header class="sky" style="${skyStyle(s.p,s.t)}"><div class="stars">${STARS}</div><div class="steps">${S.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${arcSVG(s.t)}<h1>${s.h}</h1><p>${s.d}</p>${ridge(s.p)}</header>
  <div class="panel">${body}<button class="go" data-next>${step<2?'التالي':'ابدي يومي'}</button>${step?'<button class="pill ghost" data-back style="justify-self:center">رجوع</button>':''}</div>`}
// ── wiring ──────────────────────────────────────────────────────────
let view='today';
function render(){today();if(view==='week')week();if(view==='ai')ai();if(view==='set')settings();if(view!=='today')setAccent(view==='week'?P[5]:view==='ai'?P[1]:partAt(NOW))}
function go(v){view=v;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('.nav [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v?'page':'false'));render();window.scrollTo({top:0})}
function openAdd(p){A.text='';A.timed=false;A.p=p||partAt(NOW).k==='night'?'morning':partAt(NOW).k;if(p)A.p=p;addSheet();$('s-add').classList.add('on');document.body.classList.add('open');setTimeout(()=>$('ti')?.focus(),340)}
function close(){document.body.classList.remove('open');setTimeout(()=>$('s-add').classList.remove('on'),320);render()}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-pray]');if(!b)return;
  if(b.dataset.close!==undefined&&!b.dataset.go){close();return}
  if(b.dataset.go){if(b.dataset.close!==undefined)close();go(b.dataset.go);return}
  if(b.dataset.open==='add'){openAdd(b.dataset.p);return}
  if(b.dataset.pray){prayed.has(b.dataset.pray)?prayed.delete(b.dataset.pray):prayed.add(b.dataset.pray);today();return}
  if(b.dataset.tick){const x=things.find(x=>x.id==b.dataset.tick);x.done=!x.done;today();return}
  if(b.dataset.part){const k=b.dataset.part;open.has(k)?open.delete(k):open.add(k);today();return}
  if(b.dataset.idea){A.text=b.dataset.idea;if(b.dataset.idea==='رياضة')A.p='asr';addSheet();return}
  if(b.dataset.ap){A.p=b.dataset.ap;if(A.timed)A.at=P.find(x=>x.k===A.p).a+30;addSheet();return}
  if(b.dataset.timed!==undefined){A.timed=!A.timed;if(A.timed)A.at=P.find(x=>x.k===A.p).a+30;addSheet();return}
  if(b.dataset.step){A.at=(A.at+ +b.dataset.step+1440)%1440;A.p=(P.find(x=>A.at>=x.a&&A.at<x.b)||P[5]).k;addSheet();return}
  if(b.dataset.rep!==undefined){A.rep=(A.rep+1)%3;addSheet();return}
  if(b.dataset.rem!==undefined){A.rem=!A.rem;addSheet();return}
  if(b.dataset.save!==undefined){if(!A.text.trim()){$('ti').focus();return}things.push({id:Date.now(),t:A.text.trim(),p:A.p,at:A.timed?clk(A.at):null,rep:REP[A.rep],done:false});open.add(A.p);close();return}
  if(b.dataset.say){answer(b.dataset.say);return}
  if(b.dataset.yes!==undefined||b.dataset.no!==undefined){const i=[...document.querySelectorAll('.ask')].indexOf(b.closest('.ask'));const cards=chat.filter(c=>c.head);const c=cards[i];c.state=b.dataset.yes!==undefined?c.ok:'تمام، ما سوّيت شي. گولها بطريقة ثانية.';ai();return}
  if(b.id==='send'){const v=$('sayin').value.trim();if(v)answer(v);return}
  if(b.id==='mic'){b.classList.add('on');setTimeout(()=>{b.classList.remove('on');answer('صحّيني باچر خمسة ونص')},1500);return}
  if(b.dataset.next!==undefined){if(step<2){step++;first()}else{$('first').classList.remove('on');step=0;render()}return}
  if(b.dataset.back!==undefined){step--;first();return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sayin'&&e.target.value.trim())answer(e.target.value.trim());if(e.key==='Escape')close()});
$('scrim').addEventListener('click',close);
const tm=$('tm');tm.addEventListener('input',()=>{NOW=+tm.value;$('clock').textContent=clk(NOW);render()});
let playing=null;$('play').addEventListener('click',()=>{if(playing){clearInterval(playing);playing=null;$('play').textContent='▶ اليوم كله';return}
  if(view!=='today')go('today');NOW=280;$('play').textContent='■ وقّف';playing=setInterval(()=>{NOW+=6;if(NOW>1439){clearInterval(playing);playing=null;$('play').textContent='▶ اليوم كله';NOW=910}tm.value=NOW;$('clock').textContent=clk(NOW);today()},40)});
$('fr').addEventListener('click',()=>{step=0;first();$('first').classList.add('on')});
render();
})();
</script>
